/* ================= festive effects (0.6.2) =================
   Decorative only. festive() takes no family data and reads none: the presents look the same whether or not
   anything on your list was bought, so they cannot spoil a surprise. Layers never take a tap (pointer-events:none),
   remove themselves, and are skipped when the phone asks for reduced motion. A failure here is logged, never fatal. */
const FX = {snow: 0, gifts: 0, giftsShown: false};
/* ================= 0.9.0 THEME SYSTEM =================
   A theme is a LOOK, never a layout. Every theme uses the same screens, the same navigation, the same
   forms and the same wish cards, so changing theme never makes anyone relearn the app.

   What a theme changes: the opening scene, the colour palette, the header decoration, how much snow
   falls, the Shopping decoration, and whether small ambient scenes play.

   Three rules hold for every decorative layer in this section, without exception:
     1. pointer-events:none and aria-hidden - a decoration can never take a tap or reach a screen reader.
     2. It lives OUTSIDE #app, so re-rendering a screen never disturbs it and it never covers a dialog
        (#sheet is z-index 20+ above the ambient layers, and the intro is skipped entirely while a sheet
        is open).
     3. It removes itself on a timer, and every entry point is wrapped so a failure is logged and the
        app carries on. A broken decoration must never break the app.

   The choice is stored PER PHONE (Platform.setItem), never in the family record, so Dad can run Santa
   Chases Rudolph while Heather runs Classic Christmas and neither ever sees the other's theme.

   0.9.1: only RELEASED themes are offered. Cozy Christmas House, Snowman and Sledding stay in the
   registry (and their scene code stays in the engine) so they can come back once redesigned, but they
   cannot be chosen, previewed or kept: a phone that had one moves to Classic and is told so. */
const THEMES = [
  {id:'classic',  name:'Classic Christmas',    blurb:'Pine green, cream and a little red, with gentle snow when the app opens. The clean, everyday Under the Tree look.',
   snow:'normal', amb:false, shop:'none',   scene:false, released:true,  sw:['#1F3B2D','#A4243B','#F3F6F4']},
  {id:'cozy',     name:'Cozy Christmas House', blurb:'A warm house at dusk: glowing windows, a wreath, chimney smoke and soft snowfall.',
   snow:'soft',   amb:false, shop:'lights', scene:true,  released:false, sw:['#243528','#9C2B2B','#E0A83C']},
  {id:'snowman',  name:'Snowman',              blurb:'A cheerful snowman in falling snow, with frosted blue accents through the app.',
   snow:'normal', amb:false, shop:'border', scene:true,  released:false, sw:['#2B4E63','#C0392B','#5FA8C9']},
  {id:'sledding', name:'Sledding',             blurb:'A wild sled run straight at the screen, and a comic thump against the glass.',
   snow:'normal', amb:false, shop:'none',   scene:true,  released:false, sw:['#1E4A56','#D2492A','#F0A500']},
  {id:'santa',    name:'Santa Chases Rudolph', blurb:'Santa chases Rudolph through the opening, and the chase turns up now and then across the top of the app.',
   snow:'heavy',  amb:true,  shop:'lights', scene:true,  released:true,  sw:['#123B2A','#C1121F','#F2C14E']}
];
const DEFAULT_THEME = 'classic';
function themeOffered(id){ return THEMES.some(t => t.id === id && t.released === true); }
function offeredThemes(){ return THEMES.filter(t => t.released === true); }
function themeById(id){ return THEMES.find(t => t.id === id) || THEMES[0]; }
/* An unknown, missing or withdrawn stored value falls back to Classic rather than failing: upgrading
   from 0.8.0 finds nothing stored and lands on the safe theme, exactly as a brand-new install does. */
function themeId(){ const v = Platform.getItem(K.theme); return themeOffered(v) ? v : DEFAULT_THEME; }
function theme(){ return themeById(themeId()); }
function setTheme(id){
  if(!themeOffered(id)) return false;
  Platform.setItem(K.theme, id); Platform.removeItem(K.themeNote); applyTheme(); return true;
}
/* 0.9.1: a phone that was using a withdrawn theme is moved to Classic ONCE, and told which one it had. */
function migrateTheme(){
  try {
    const v = Platform.getItem(K.theme);
    const t = THEMES.find(x => x.id === v);
    if(t && !t.released){ Platform.setItem(K.theme, DEFAULT_THEME); Platform.setItem(K.themeNote, t.name); }
  } catch(e){ warnFx('theme-migrate', e); }
}
/* Overrides. 'default' means "whatever this theme does"; anything else is the person overruling it. */
/* 'default' is stored as an absent key, so a theme's own choice is what a cleared setting means. */
function setPref(key, val, allowed){
  if(val === 'default'){ Platform.removeItem(key); return true; }
  if(allowed.indexOf(val) < 0) return false;
  Platform.setItem(key, val); return true;
}
function pref(key, allowed){ const v = Platform.getItem(key); return allowed.indexOf(v) >= 0 ? v : 'default'; }
function snowPref(){ return pref(K.snow, ['on', 'off']); }
function ambPref(){ const v = Platform.getItem(K.amb); return ['off', 'low', 'normal'].indexOf(v) >= 0 ? v : 'default'; }
function shopPref(){ return pref(K.shop, ['none', 'border', 'lights']); }
function snowMode(){ const p = snowPref(); return p === 'off' ? 'off' : p === 'on' ? 'normal' : theme().snow; }
/* Ambient level: Off, Low (rarer) or Normal. A theme with no ambient scenes stays off unless asked. */
function ambLevel(){
  const p = ambPref();
  if(p !== 'default') return p;
  return theme().amb ? 'normal' : 'off';
}
function shopDeco(){ const p = shopPref(); return p === 'default' ? theme().shop : p; }
const SNOW_FLAKES = {off: 0, light: 26, soft: 40, normal: 70, heavy: 110};
const SNOW_LIFE = {off: 0, light: 14000, soft: 18000, normal: 23000, heavy: 26000};

function applyTheme(){
  try {
    const t = theme();
    document.documentElement.setAttribute('data-theme', t.id);
    /* 0.9.1: the Santa chase gags play ONLY inside a strip reserved at the bottom of the app bar,
       which holds no button, list or field. The strip exists only while gags can play. */
    document.documentElement.setAttribute('data-runway', ambWanted() ? '1' : '0');
    const meta = document.querySelector('meta[name="theme-color"]');
    if(meta) meta.setAttribute('content', t.sw[0]);
    paintDeco();
    /* A theme change takes effect at once, including switching the ambient timer on or off. */
    if(ambWanted()) ambStart(); else ambStop();
  } catch(e){ warnFx('theme', e); }
}
function warnFx(what, e){ try { console.warn('Decoration "' + what + '" skipped: ' + ((e && e.message) || e)); } catch(x){} }

/* Header light strand and Shopping decoration. Rebuilt on every render, which is cheap and keeps the
   decoration in step with the tab the person is actually on. */
function paintDeco(){
  try {
    const host = document.getElementById('deco'); if(!host) return;
    if(reducedMotion()){ host.innerHTML = ''; return; }
    const t = theme(); let h = '';
    const bulbs = ['#E23B3B', '#F2C14E', '#4FA36B', '#6FB7D6', '#E88C3A'];
    if(t.id === 'cozy' || t.id === 'santa'){
      let l = '<div class="lights">';
      for(let i = 0; i < 26; i++) l += '<i style="left:' + (i * 4 + 1) + '%;background:' + bulbs[i % 5] +
        ';box-shadow:0 0 7px 2px ' + bulbs[i % 5] + ';animation-delay:' + (i * 0.17).toFixed(2) + 's"></i>';
      h += l + '</div>';
    }
    if(S.tab === 'shopping' && !S.manage){
      const d = shopDeco();
      if(d === 'border') h += '<div class="decoborder"><i class="l"></i><i class="r"></i></div>';
      else if(d === 'lights') h += strandHtml(bulbs);
    }
    host.innerHTML = h;
    /* The app-bar strand lives INSIDE the app bar (bottom:0), so it never reaches the page below it. */
    const strand = host.querySelector('.lights');
    if(strand){ const top = document.querySelector('#app .top'); if(top) top.appendChild(strand); else strand.remove(); }
    /* 0.9.1: the Shopping strand hangs from the FOOT of the app bar (0.9.0 hung it from the top of the
       screen, so on a tall app bar - the Santa theme's - it was hidden behind the bar entirely), and it is
       drawn BEHIND the page (z-index -1): text and cards sit on top of it, so it never covers anything. */
    const dangle = host.querySelector('.strand');
    if(dangle){
      const bar = document.querySelector('#app .top');
      const foot = bar ? bar.getBoundingClientRect().bottom : 0;
      dangle.style.top = Math.max(0, Math.round(foot) - 8) + 'px';
    }
  } catch(e){ warnFx('deco', e); }
}
/* Dangling top lights: the wire dips and rises unevenly, one span hangs noticeably lower than the
   rest, and the single lowest bulb sways. Drawn as one SVG path so the dips really are uneven. */
function strandHtml(bulbs){
  const W = 100, pts = [], dips = [16, 30, 14, 52, 18, 26];  /* the 4th span is the low one */
  let d = 'M 0 6';
  for(let i = 0; i < dips.length; i++){
    const x0 = (i / dips.length) * W, x1 = ((i + 1) / dips.length) * W, mid = (x0 + x1) / 2;
    d += ' Q ' + mid.toFixed(1) + ' ' + (6 + dips[i] * 1.7).toFixed(1) + ' ' + x1.toFixed(1) + ' 6';
    pts.push({x: mid, y: 6 + dips[i] * 1.25, low: dips[i] > 40});
  }
  let h = '<div class="strand"><svg viewBox="0 0 100 100" preserveAspectRatio="none">' +
    '<path d="' + d + '" fill="none" stroke="rgba(30,45,36,.55)" stroke-width="0.7" vector-effect="non-scaling-stroke"/></svg>';
  pts.forEach((p, i) => {
    /* one bulb on the low span dangles a little too far down, and that is the one that sways */
    const extra = p.low ? 16 : 0;
    h += '<i class="bulb' + (p.low ? ' low' : '') + '" style="left:calc(' + p.x.toFixed(1) + '% - 5px);top:' +
      (p.y + extra).toFixed(1) + 'px;background:' + bulbs[i % 5] + ';box-shadow:0 0 9px 3px ' + bulbs[i % 5] +
      ';animation-delay:' + (i * 0.29).toFixed(2) + 's"></i>';
  });
  return h + '</div>';
}

/* ---------------- the opening scene ----------------
   Runs once when the app opens, over the top of the app, taking no taps. Skipped under reduced motion,
   and skipped entirely if a dialog is already open. */
const INTRO = {played: 0, kind: '', run: 0};
function intro(){
  try {
    const host = document.getElementById('intro'); if(!host) return false;
    if(reducedMotion() || sheetOpen()) return false;
    const t = theme(); let h = '', life = 3400;
    /* 0.9.1: Classic Christmas has no opening artwork - it opens with the snow alone, as 0.8.0 did. */
    if(!t.scene) return false;
    if(t.id === 'cozy'){
      h = '<div class="scene"><div class="ground"></div>' +
        '<div class="lantern" style="left:18%"></div><div class="lantern" style="left:78%"></div>' +
        '<div class="tree" style="left:12%"></div><div class="tree" style="right:10%"></div>' +
        '<div class="house"><div class="roof"></div><div class="body"></div>' +
        '<div class="win w1"></div><div class="win w2"></div><div class="door"></div><div class="wreath"></div>' +
        '<div class="chim"></div></div>' +
        '<div class="smoke"></div><div class="smoke" style="animation-delay:1.5s"></div><div class="smoke" style="animation-delay:3s"></div>' +
        '</div>';
      life = 4200;
    } else if(t.id === 'snowman'){
      h = '<div class="scene"><div class="ground"></div><div class="sman">' +
        '<div class="ball b1"></div><div class="ball b2"></div><div class="ball b3"></div>' +
        '<div class="hat"></div><div class="eye e1"></div><div class="eye e2"></div>' +
        '<div class="nose"></div><div class="smile"></div><div class="scarf"></div><div class="tail"></div>' +
        '</div></div>';
      life = 3800;
    } else if(t.id === 'sledding'){
      let sp = '';
      for(let i = 0; i < 14; i++) sp += '<span class="spray" style="--sx:' + rnd(-90, 90).toFixed(0) +
        'px;--sy:' + rnd(-70, 40).toFixed(0) + 'px;animation-delay:' + rnd(0.3, 1.9).toFixed(2) + 's"></span>';
      let sl = '';
      for(let i = 0; i < 18; i++) sl += '<span class="splash" style="--px:' + rnd(-150, 150).toFixed(0) +
        'px;--py:' + rnd(-130, 110).toFixed(0) + 'px;animation-delay:' + (2.45 + rnd(0, .3)).toFixed(2) + 's"></span>';
      h = '<div class="scene"><div class="hill"></div>' + sp +
        '<div class="sled"><div class="kid"><div class="cap"></div><div class="head"></div>' +
        '<div class="torso"></div><div class="board"></div></div></div>' +
        '<div class="splat"><div class="leg l1"></div><div class="leg l2"></div>' +
        '<div class="boot bt1"></div><div class="boot bt2"></div><div class="seat"></div><div class="seam"></div></div>' +
        sl + '</div>';
      life = 5400;
    } else {
      h = '<div class="scene"><div class="ground"></div>' + chaseHtml(true) + '</div>';
      life = 9200;
    }
    /* Changing or previewing a theme starts a new scene while the old one's timers are still
       pending. Stamp each run, and let only the current run touch the layer - otherwise the shorter
       scene's tidy-up wipes the longer scene that replaced it. */
    const run = ++INTRO.run;
    host.hidden = false; host.className = ''; host.innerHTML = h;
    INTRO.played++; INTRO.kind = t.id;
    if(t.id === 'santa') runChase(host, true, run);
    setTimeout(() => { try { if(INTRO.run === run) host.className = 'fade'; } catch(e){} }, Math.max(0, life - 700));
    setTimeout(() => { try { if(INTRO.run !== run) return; host.innerHTML = ''; host.hidden = true; host.className = ''; } catch(e){} }, life);
    return true;
  } catch(e){ warnFx('intro', e); return false; }
}
function treeSvg(leftPct, bottomPct){
  return '<div class="tree" style="left:calc(' + leftPct + '% - 26px);bottom:' + bottomPct + '%"></div>';
}

/* ---------------- Santa chases Rudolph ----------------
   Speech bubbles only. There is deliberately NO spoken dialogue anywhere in this app: the music is the
   audio layer, and a voice would fight it. The joke is carried entirely by what you see. */
const CHASE_LINES = ['Rudolph! Stop it! Come here!', 'RUDOLPH!'];
const RUD_IN_MS = 1500, RUD_ESCAPE_MS = 480;
function chaseHtml(full){
  return '<div class="runner rudolph" id="rud" style="left:-90px">' +
      '<div class="tail"></div><div class="body"></div><div class="neck"></div><div class="head"></div>' +
      '<div class="antler a1"></div><div class="antler a2"></div>' +
      '<div class="nose" id="rudnose"></div>' +
      '<div class="leg g1"></div><div class="leg g2"></div><div class="leg g3"></div><div class="leg g4"></div></div>' +
    '<div class="runner santa" id="san" style="left:-160px">' +
      '<div class="body"></div><div class="belt"></div><div class="head"></div><div class="beard"></div>' +
      '<div class="hat"></div><div class="arm"></div><div class="cane"></div>' +
      '<div class="leg g1"></div><div class="leg g2"></div></div>' +
    (full ? '<div id="bubs"></div>' : '');
}
/* The opening chase, beat by beat. Every step is a timer on a layer that takes no taps, and the whole
   thing is torn down by the caller's life timer even if a step throws. */
function runChase(host, full, run){
  const rud = host.querySelector('#rud'), san = host.querySelector('#san');
  const nose = host.querySelector('#rudnose'), bubs = host.querySelector('#bubs');
  if(!rud || !san) return;
  /* Every beat checks it still belongs to the current scene, so a theme change mid-chase stops it
     dead instead of driving elements that are no longer on screen. */
  const live = () => run === undefined || INTRO.run === run;
  const at = (ms, fn) => setTimeout(() => { try { if(live()) fn(); } catch(e){ warnFx('chase', e); } }, ms);
  const move = (el, left, ms, ease) => { el.style.transition = 'left ' + ms + 'ms ' + (ease || 'linear'); el.style.left = left; };
  const bubble = (text, left) => {
    if(!bubs) return;
    const b = document.createElement('div');
    b.className = 'bub'; b.style.left = left; b.style.bottom = '96px'; b.textContent = text;
    bubs.appendChild(b); setTimeout(() => { try { b.remove(); } catch(e){} }, 2700);
  };
  /* 1-2: Rudolph runs in and slows to a stop. */
  /* a steady trot in that eases to a stop (0.9.1: no fast burst at the start, so the escape is the fast part) */
  at(120, () => move(rud, '46%', RUD_IN_MS, 'cubic-bezier(.3,.45,.45,1)'));
  /* 3-4: he looks back, and the nose starts to glow because he has spotted Santa. */
  at(1700, () => { rud.style.transform = 'scaleX(-1)'; if(nose) nose.className = 'nose notice'; });
  /* 5-7: Santa runs in carrying the candy cane, and shakes it at him. */
  at(2000, () => move(san, '10%', 1600, 'cubic-bezier(.2,.6,.3,1)'));
  at(3500, () => san.classList.add('shake'));
  /* 8: the first speech bubble. No audio. */
  at(3600, () => bubble(CHASE_LINES[0], '14%'));
  /* 9-10: Rudolph reacts and the nose FLARES. */
  at(5100, () => { rud.style.transform = 'none'; if(nose) nose.className = 'nose flare'; });
  /* 11-12: he jumps unusually high, lands, and bolts - more than twice as fast as he came in
     (in: 1.5 s for about half the screen; out: under half a second for the rest, legs at double speed).
     Measured on screen by tests/layout_chromium.py (L3), not just asserted from these numbers. */
  at(5300, () => { rud.style.transition = 'left ' + RUD_ESCAPE_MS + 'ms cubic-bezier(.35,0,.75,.6), bottom .42s ease-out'; rud.style.bottom = '92px'; });
  at(5720, () => { rud.style.bottom = '6px'; rud.classList.add('fast'); });
  at(5750, () => { rud.style.left = '115%'; });
  /* 13-15: Santa slows, shakes the cane again, and the last bubble. */
  at(6300, () => { move(san, '18%', 900, 'ease-out'); san.classList.remove('shake'); });
  at(6600, () => { san.classList.add('shake'); bubble(CHASE_LINES[1], '22%'); });
  /* 16: and off he goes after him. */
  at(8100, () => { san.classList.remove('shake'); move(san, '115%', 1500, 'ease-in'); });
}

/* ---------------- ambient chase gags ----------------
   Small, occasional, and never in the way. Four different scenes chosen at random so the same one is
   not repeated every time, with a cooldown between them. Nothing plays while a dialog or form is open,
   while the app is in the background, or on the setup screens. */
const AMB = {shown: 0, last: 0, timer: null, running: false, kind: ''};
const AMB_COOLDOWN = {normal: 45000, low: 90000};
const RUNWAY_PX = 38;
function ambWindow(){ const l = ambLevel(); return l === 'low' ? AMB_COOLDOWN.low : AMB_COOLDOWN.normal; }
/* Every reason the app has to keep quiet, in one place. */
function introShowing(){ const el = document.getElementById('intro'); return !!el && !el.hidden && el.innerHTML !== ''; }
function ambBlocked(){
  return ambLevel() === 'off' || theme().id !== 'santa' || reducedMotion()
    || AMB.running || document.hidden || sheetOpen() || !S.cfg || !S.snap
    /* 0.9.1: never on top of the opening scene, and not while the Stop-music button is up */
    || introShowing() || !!MUSIC.kind || S.needClaim || !document.querySelector('#app .top');
}
function ambScenes(){
  /* [name, how the pair behaves]. Kept deliberately small: a run past, a peek from the side, a quick
     double-back, and a straight dash. All of them play inside the app bar's reserved strip. */
  return ['runpast', 'peek', 'doubleback', 'dash'];
}
function ambTick(){
  try {
    if(ambBlocked()) return;
    if(Date.now() - AMB.last < ambWindow()) return;
    ambPlay(ambScenes()[Math.floor(Math.random() * 4)]);
  } catch(e){ warnFx('ambient', e); }
}
function ambPlay(kind){
  const host = document.getElementById('deco'); if(!host) return false;
  /* 0.9.1: the gag lives in the strip reserved at the bottom of the app bar (see applyTheme and the
     data-runway CSS). It is measured each time, so it follows the bar whatever its height. */
  const bar = document.querySelector('#app .top');
  if(!bar || document.documentElement.getAttribute('data-runway') !== '1') return false;
  let layer;
  try {
    const r = bar.getBoundingClientRect();
    layer = document.createElement('div');
    layer.className = 'amb runway'; layer.setAttribute('aria-hidden', 'true');
    layer.style.top = Math.max(0, Math.round(r.bottom) - RUNWAY_PX) + 'px'; layer.style.height = RUNWAY_PX + 'px';
    layer.innerHTML = '<div class="stage">' + chaseHtml(false) + '</div>';
    host.appendChild(layer);
    AMB.running = true; AMB.shown++; AMB.last = Date.now(); AMB.kind = kind;
    const rud = layer.querySelector('#rud'), san = layer.querySelector('#san');
    const nose = layer.querySelector('#rudnose');
    const at = (ms, fn) => setTimeout(() => { try { fn(); } catch(e){ warnFx('ambient', e); } }, ms);
    const move = (el, left, ms, ease) => { el.style.transition = 'left ' + ms + 'ms ' + (ease || 'linear'); el.style.left = left; };
    let life = 7000;
    if(kind === 'runpast'){
      /* Rudolph crosses the bottom edge; Santa follows a moment later, shaking the cane. */
      at(60, () => move(rud, '115%', 2300, 'ease-in'));
      at(900, () => { san.classList.add('shake'); move(san, '115%', 2800, 'ease-in'); });
      life = 4200;
    } else if(kind === 'peek'){
      /* Rudolph peeks in from the edge, Santa comes looking, Rudolph bolts. */
      at(60, () => move(rud, '4%', 900, 'ease-out'));
      at(1200, () => { if(nose) nose.className = 'nose notice'; });
      at(1500, () => move(san, '-2%', 1200, 'ease-out'));
      at(2900, () => { san.classList.add('shake'); if(nose) nose.className = 'nose flare'; });
      at(3300, () => move(rud, '115%', 1500, 'ease-in'));
      at(4400, () => { san.classList.remove('shake'); move(san, '115%', 1700, 'ease-in'); });
      life = 6400;
    } else if(kind === 'doubleback'){
      /* He gets halfway, changes his mind, and goes back the way he came. Santa misses him entirely. */
      at(60, () => move(rud, '55%', 1500, 'ease-out'));
      at(1700, () => { rud.style.transform = 'scaleX(-1)'; });
      at(1900, () => move(rud, '-90px', 1500, 'ease-in'));
      at(2600, () => { move(san, '70%', 2200, 'ease-out'); });
      at(4900, () => { san.classList.add('shake'); });
      at(5600, () => { san.classList.remove('shake'); move(san, '115%', 1400, 'ease-in'); });
      life = 7200;
    } else {
      /* A straight dash: Rudolph flat out, Santa a step behind. */
      at(60, () => move(rud, '115%', 1900, 'linear'));
      at(700, () => move(san, '115%', 2300, 'linear'));
      life = 3600;
    }
    setTimeout(() => {
      try { layer.remove(); } catch(e){}
      AMB.running = false;
    }, life);
    return true;
  } catch(e){
    warnFx('ambient', e);
    try { if(layer) layer.remove(); } catch(x){}
    AMB.running = false;
    return false;
  }
}
/* Only themes with ambient scenes ever get a timer. A Classic or Snowman phone runs NO periodic work
   at all, which keeps the battery cost of this feature at zero for anyone who did not ask for it. */
function ambWanted(){ return ambLevel() !== 'off' && theme().id === 'santa' && !reducedMotion(); }
function ambStart(){
  if(AMB.timer || !ambWanted()) return;
  /* 0.9.1: the first gag waits a full cooldown after the app opens - the opening scene is enough. */
  if(!AMB.last) AMB.last = Date.now();
  /* Checked often, played rarely: the cooldown inside ambTick is what actually paces it. */
  AMB.timer = setInterval(ambTick, 5000);
}
function ambStop(){
  if(AMB.timer){ clearInterval(AMB.timer); AMB.timer = null; }
  try {
    const host = document.getElementById('deco');
    if(host) Array.prototype.forEach.call(host.querySelectorAll('.amb'), n => n.remove());
  } catch(e){}
  AMB.running = false;
}

function reducedMotion(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function festive(kind){
  try {
    if(reducedMotion()) return false;
    const id = 'fx-' + kind; const old = document.getElementById(id); if(old) old.remove();
    const layer = document.createElement('div'); layer.id = id; layer.className = 'fx'; layer.setAttribute('aria-hidden', 'true');
    let h = '', life;
    if(kind === 'snow'){
      /* 0.9.0: how much snow is the theme's business, unless the person overruled it in Settings. */
      const mode = snowMode(); const n = SNOW_FLAKES[mode] || 0;
      if(!n) return false;
      for(let i = 0; i < n; i++){
        h += '<span class="flake" style="left:' + rnd(0, 100).toFixed(1) + '%;font-size:' + rnd(12, 28).toFixed(0) + 'px;animation-duration:' + rnd(6, 10).toFixed(2) +
          's;animation-delay:' + rnd(0, 12).toFixed(2) + 's;--drift:' + rnd(-60, 60).toFixed(0) + 'px">\u2744</span>';
      }
      life = SNOW_LIFE[mode] || 23000;
    } else {
      const colors = ['#C8102E', '#1E7B3C', '#D4AF37', '#FFFFFF', '#E23B53', '#2FA35A'];
      for(let i = 0; i < 12; i++){
        const left = rnd(4, 88).toFixed(1), dur = rnd(1.3, 1.9), delay = rnd(0, 1.2), pop = delay + dur * 0.88;
        h += '<span class="gift" style="left:' + left + '%;font-size:' + rnd(30, 46).toFixed(0) + 'px;--spin:' + rnd(-20, 20).toFixed(0) +
          'deg;animation-duration:' + dur.toFixed(2) + 's;animation-delay:' + delay.toFixed(2) + 's">\uD83C\uDF81</span>';
        h += '<span class="burst" style="left:' + left + '%">';
        for(let k = 0; k < 14; k++){
          const dx = rnd(-150, 150), col = colors[k % colors.length];
          h += '<i class="confetti' + (k % 4 === 3 ? ' round' : '') + '" style="--dx:' + dx.toFixed(0) + 'px;--dx2:' + (dx * 1.5).toFixed(0) + 'px;--up:' + rnd(-340, -140).toFixed(0) +
            'px;--down:' + rnd(60, 180).toFixed(0) + 'px;--r1:' + rnd(-360, 360).toFixed(0) + 'deg;--r2:' + rnd(-900, 900).toFixed(0) + 'deg;background:' + col +
            (col === '#FFFFFF' ? ';box-shadow:0 0 0 1px #C9A227' : '') + ';animation-delay:' + pop.toFixed(2) + 's"></i>';
        }
        h += '</span>';
      }
      life = 5600;
    }
    layer.innerHTML = h; layer.dataset.life = String(life); document.body.appendChild(layer); FX[kind]++;
    setTimeout(() => { layer.remove(); }, life);
    return true;
  } catch(e){ try { console.warn('Festive effect "' + kind + '" skipped: ' + ((e && e.message) || e)); } catch(x){} return false; }
}

/* ================= music on open (0.7.0) =================
   Default: Jingle Bells played by the app itself (music-box sound, about 18 seconds).
   Jingle Bells: James Lord Pierpont, 1857. Public domain. Nothing copyrighted ships in the app.
   Android only: a person may pick a song file already on their own phone instead; the phone plays it natively
   (up to 30 seconds, fading out). Never plays when the phone is on silent or vibrate or when switched off in
   Settings, and stops when the app goes to the background. A Stop button shows while it plays. */
const HOLD_DEFAULT = 48;
const HOLD_CHOICES = [0, 12, 24, 48, 72, 96, 168];
const HOLD_GRACE_MS = 5 * 60 * 1000;
const MUSIC_MAX_MS = 30000;
const JINGLE = [ // [MIDI note, beats], chorus in C, one octave up for a music-box sound
  [76,1],[76,1],[76,2], [76,1],[76,1],[76,2], [76,1],[79,1],[72,1.5],[74,.5], [76,4],
  [77,1],[77,1],[77,1.5],[77,.5], [77,1],[76,1],[76,1],[76,.5],[76,.5], [76,1],[74,1],[74,1],[76,1], [74,2],[79,2],
  [76,1],[76,1],[76,2], [76,1],[76,1],[76,2], [76,1],[79,1],[72,1.5],[74,.5], [76,4],
  [77,1],[77,1],[77,1],[77,1], [77,1],[76,1],[76,1],[76,.5],[76,.5], [79,1],[79,1],[77,1],[74,1], [72,4]
];
const JINGLE_BASS = [48,48,48,48, 53,48,50,55, 48,48,48,48, 53,48,55,48]; // one root per bar, on beats 1 and 3
const MUSIC = {plays: 0, kind: '', ctx: null, timer: null};
function midiHz(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function musicEnabled(){ return Platform.getItem(K.music) !== 'off'; }
function phoneQuiet(){ try { return !!(Native && typeof Native.ringerQuiet === 'function' && Native.ringerQuiet() === true); } catch(e){ return false; } }
function customSong(){ try { return Native && typeof Native.songName === 'function' ? String(Native.songName() || '') : ''; } catch(e){ return ''; } }
function musicButton(show){ const el = document.getElementById('music'); if(el) el.innerHTML = show ? '<button class="mbtn" data-act="music:stop">\u266B Stop music</button>' : ''; }
function stopMusic(){
  clearTimeout(MUSIC.timer); MUSIC.timer = null;
  if(MUSIC.ctx){ try { MUSIC.ctx.close(); } catch(e){} MUSIC.ctx = null; }
  if(MUSIC.kind === 'song'){ try { Native.stopSong(); } catch(e){} }
  MUSIC.kind = ''; musicButton(false);
}
function tone(ctx, out, hz, t, len, type, peak){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = hz;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + len + 0.05);
}
function playCarol(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  const ctx = new AC(); const out = ctx.createGain(); out.gain.value = 0.22; out.connect(ctx.destination);
  const beat = 0.28, t0 = ctx.currentTime + 0.2; let t = t0;
  JINGLE.forEach(n => {
    if(n[0]){ const len = Math.max(0.35, n[1] * beat * 1.8); tone(ctx, out, midiHz(n[0]), t, len, 'sine', 0.5); tone(ctx, out, midiHz(n[0]) * 2, t, len * 0.6, 'sine', 0.12); }
    t += n[1] * beat;
  });
  JINGLE_BASS.forEach((n, bar) => { [0, 2].forEach(k => tone(ctx, out, midiHz(n), t0 + (bar * 4 + k) * beat, 2 * beat, 'triangle', 0.18)); });
  const runMs = Math.ceil((t - t0) * 1000) + 1500;
  MUSIC.ctx = ctx; MUSIC.kind = 'carol'; MUSIC.timer = setTimeout(stopMusic, runMs);
  if(ctx.state === 'suspended'){
    // Browsers (the web version) hold sound until the first tap. Start then, if it comes within 10 seconds.
    const opened = Date.now();
    const go = () => {
      document.removeEventListener('pointerdown', go, true);
      if(MUSIC.ctx !== ctx) return;
      if(Date.now() - opened > 10000){ stopMusic(); return; }
      try { ctx.resume(); } catch(e){}
      clearTimeout(MUSIC.timer); MUSIC.timer = setTimeout(stopMusic, runMs);
    };
    document.addEventListener('pointerdown', go, true);
  }
  return true;
}
function startMusic(preview){
  if(MUSIC.kind) return false;
  if(!preview && (!musicEnabled() || phoneQuiet())) return false;
  let ok = false;
  try {
    if(customSong() && Native.playSong(MUSIC_MAX_MS) === true){ MUSIC.kind = 'song'; ok = true; }
    else ok = playCarol();
  } catch(e){ try { console.warn('Music skipped: ' + ((e && e.message) || e)); } catch(x){} ok = false; }
  if(ok){ MUSIC.plays++; musicButton(true); }
  return ok;
}
window.UTT_onMusicEnd = function(json){
  const r = parseJSON(json || '') || {};
  if(MUSIC.kind === 'song'){ MUSIC.kind = ''; musicButton(false); }
  if(r.error) toast('Your song couldn’t play: ' + r.error, 'err');
};
window.UTT_onSong = function(json){
  const r = parseJSON(json || '') || {};
  if(r.error) toast('Couldn’t use that song: ' + r.error, 'err');
  else if(r.name) toast('Song set: ' + r.name + '. It plays when the app opens.');
  if(S.cfg && S.tab === 'settings' && !sheetOpen()) render();
};
window.UTT_onPause = function(){ stopMusic(); ambStop(); };
window.UTT_onResume = function(){ try { applyTheme(); ambStart(); } catch(e){ warnFx('resume', e); } };
/* The browser's own background signal, for the web version and for Android's WebView. */
document.addEventListener('visibilitychange', function(){
  try { if(document.hidden) ambStop(); else ambStart(); } catch(e){ warnFx('visibility', e); }
});

function boot(){
  migrateTheme();
  S.cfg = readJSON(K.cfg);
  const shared = Platform.consumeShared(); if(shared) S.pendingShare = shared;
  if(S.cfg){
    S.backend = makeBackend(S.cfg);
    if(S.cfg.mode === 'firebase'){
      const c = readJSON(K.cache);
      if(c && c.familyId === S.cfg.familyId && c.snap){
        S.snap = c.snap; S.stale = true;
        if(c.diag){ Diag.at = c.diag.at; Diag.included = c.diag.included; Diag.expected = c.diag.expected || []; Diag.unexpected = c.diag.unexpected || []; }
        const m = me(); S.needClaim = !m || m.uid !== S.backend.uid;
      }
    }
    render(); refresh();
  } else { render(); handleShare(); }
  applyTheme();
  festive('snow');
  intro();
  ambStart();
  startMusic(false);
}
window.UTT = { S, Diag, Platform, BACKEND, secretId, currentInvite, parseProduct, normalizeUrl, extractUrl, storeFromHost, makeInvite, readInvite, toFields, fromFields,
  FirestoreBackend, LocalBackend, buildSnapshot, refresh, version: APP_VERSION, fx: FX, music: MUSIC, JINGLE, JINGLE_BASS,
  THEMES, themeId, setTheme, theme, applyTheme, snowMode, ambLevel, shopDeco, intro, INTRO, AMB,
  themeOffered, offeredThemes, migrateTheme, introShowing, RUD_IN_MS, RUD_ESCAPE_MS, RUNWAY_PX,
  orgClaimChecks, fp, RULES_PROBE, claimFailMessage,
  ambTick, ambPlay, ambStart, ambStop, ambBlocked, ambWindow, ambWanted, CHASE_LINES, SNOW_FLAKES,
  festive, paintDeco, reducedMotion,
  isOrganizerMember, isRemoved, meIsOrganizer, organizerCount, canManageFamily, connChip };
boot();
})();
