<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3B2D">
<title>Under the Tree</title>
<style>
:root{
  --pine:#1F3B2D; --ink:#16261E; --muted:#4E6B59; --snow:#F3F6F4; --frost:#DCE5DF; --paper:#FFFFFF;
  --cran:#A4243B; --cran-2:#861B2F; --gold:#C9A227; --gold-ink:#6E5410; --ok:#2F6B4A;
  --hand:"Dancing Script","Snell Roundhand","Segoe Script",cursive;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif;
  --sans:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--snow);color:var(--ink);font:16px/1.5 var(--sans);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.top{background:var(--pine);color:#fff;padding:14px 16px 14px;display:flex;align-items:flex-end;gap:12px;position:sticky;top:0;z-index:5}
.top .grow{flex:1;min-width:0}
.brand{font-family:var(--hand);font-size:34px;line-height:1.05;font-weight:700}
.who{font-size:13px;color:#D6E3DA;line-height:1.35;margin-top:4px;overflow-wrap:anywhere}
.refresh{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;min-height:38px;flex:none}
.refresh[disabled]{opacity:.6}

.banner{padding:10px 16px;font-size:14px;border-bottom:1px solid var(--frost)}
.banner.demo{background:#FFF6D6;color:#5B4708}
.banner.err{background:#FBE7EA;color:#6B1222}
.banner.stale{background:#E6EDF6;color:#223A5E}
.banner .btn{margin-top:6px}

main{padding:16px 16px 150px;max-width:640px;margin:0 auto}
h2{font-family:var(--serif);font-size:24px;line-height:1.2;margin:4px 0 6px;font-weight:600}
h3{font-family:var(--serif);font-size:18px;line-height:1.3;margin:20px 0 8px;font-weight:600}
.hint{color:var(--muted);margin:0 0 16px;font-size:15px}
.to{font-family:var(--hand);font-weight:700;font-size:24px;color:var(--cran);line-height:1.1;margin:0 0 4px}
.to.big{font-size:34px;margin:4px 0 8px}
.empty{background:#fff;border:1px dashed #A9BDB0;border-radius:12px;padding:18px 16px;color:var(--muted)}

/* Wish cards are gift tags: pointed left edge, punched hole, gold string. */
.tagwrap{position:relative;margin:0 0 14px 8px;filter:drop-shadow(0 1px 0 var(--frost)) drop-shadow(0 3px 8px rgba(22,38,30,.08))}
.tagwrap::before{content:"";position:absolute;left:-10px;top:calc(50% - 1px);width:30px;height:2px;background:var(--gold);transform:rotate(-24deg);transform-origin:right center;border-radius:2px}
.tag{position:relative;background:var(--paper);padding:14px 14px 12px 38px;clip-path:polygon(20px 0,100% 0,100% 100%,20px 100%,0 50%);border-radius:0 10px 10px 0}
.tag::before{content:"";position:absolute;left:14px;top:calc(50% - 6px);width:12px;height:12px;border-radius:50%;background:var(--snow);box-shadow:0 0 0 2px var(--gold)}
.tag.dim{opacity:.72}
.tag-body{display:flex;gap:12px;align-items:flex-start}
.thumb{width:72px;height:72px;object-fit:contain;background:#fff;border:1px solid var(--frost);border-radius:8px;flex:none}
.tag-text{min-width:0;flex:1}
.title{font-family:var(--sans);font-size:17px;font-weight:600;margin:0 0 2px;line-height:1.3;overflow-wrap:anywhere}
.meta{margin:0;color:var(--muted);font-size:14px}
.exact{margin:6px 0 0;font-size:13px;display:inline-block;padding:2px 9px;border-radius:999px}
.exact.yes{background:#E4EEE7;color:#23452F}
.exact.no{background:#EFEAF6;color:#4A3A66}
.note{margin:6px 0 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.status{margin:10px 0 0;font-size:14px;font-weight:600}
.status.avail{color:var(--ok)} .status.mine{color:var(--gold-ink)} .status.taken{color:var(--muted)} .status.unknown{color:var(--cran-2)}
.status.bought{color:var(--pine)} .status.bought::before{content:"\2713\00a0"}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

.btn{border:1px solid #C8D5CC;background:#fff;border-radius:999px;padding:8px 16px;min-height:42px;font-size:15px}
.btn.primary{background:var(--cran);border-color:var(--cran);color:#fff;font-weight:600}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);padding-left:10px;padding-right:10px}
.btn.danger{color:var(--cran-2);border-color:#E7C3CA}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55}
.linkish{background:none;border:0;color:var(--pine);font-weight:600;padding:8px 0;min-height:40px;text-decoration:underline;text-underline-offset:3px}

.fab{position:fixed;right:16px;bottom:86px;z-index:6;background:var(--cran);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(134,27,47,.35);min-height:52px}
.nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--frost);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:0;padding:10px 2px 12px;font-size:14px;color:var(--muted);min-height:60px;position:relative}
.nav button[aria-current="page"]{color:var(--pine);font-weight:700}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:28%;right:28%;top:0;height:3px;background:var(--cran);border-radius:0 0 3px 3px}

.person{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--frost);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.person .sub{color:var(--muted);font-size:14px;display:block}
.panel{background:#fff;border:1px solid var(--frost);border-radius:12px;padding:2px 14px 14px;margin:0 0 14px}
.panel h3{margin-top:14px}
.invite{display:block;word-break:break-all;background:var(--snow);border:1px dashed #9FB4A6;padding:10px;border-radius:8px;font-size:13px;margin:8px 0;user-select:all}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:9px 0;border-bottom:1px solid var(--frost);display:flex;justify-content:space-between;gap:10px}
.plist li:last-child{border-bottom:0}
.chip{font-size:13px;color:var(--muted);text-align:right}
details{margin-top:8px} summary{cursor:pointer;font-weight:600;padding:6px 0}
details ul{margin:4px 0 0;padding-left:20px;font-size:14px}
.total{font-size:15px;color:var(--muted);margin:0 0 12px}

.scrim{position:fixed;inset:0;background:rgba(16,28,22,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom))}
.field{display:block;margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid #B9C9BE;border-radius:10px;background:#fff;font-size:16px;color:var(--ink);font-weight:400}
.field textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;font-size:16px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--cran);flex:none}
fieldset.yn{border:1px solid var(--frost);border-radius:10px;padding:6px 12px 8px;margin:0 0 12px}
fieldset.yn legend{font-size:14px;font-weight:600;color:var(--muted);padding:0 4px}
.yn label{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:16px}
.yn input{width:20px;height:20px;accent-color:var(--cran)}
.fill-status{font-size:14px;margin:6px 0 12px;min-height:1.2em}
.fill-status.ok{color:var(--ok)} .fill-status.warn{color:#7A5200} .fill-status.err{color:var(--cran-2)}
.preview{display:flex;gap:10px;align-items:center;margin:0 0 12px}
.sheet-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;padding-top:10px;position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;padding-bottom:6px}

#toast{position:fixed;left:16px;right:16px;bottom:156px;z-index:50;display:flex;justify-content:center;pointer-events:none}
#toast .t{background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;max-width:520px;font-size:15px;pointer-events:auto}
#toast .t.err{background:var(--cran-2)}
#toast .t.ho{background:var(--pine);border:2px solid var(--gold);font-weight:600}
.taken-note .linkish{padding:0 0 0 4px;min-height:0;font-size:inherit}
.holdnote{margin:4px 0 0;font-size:13px;color:var(--muted)}
.from{margin:0 0 4px;font-size:13px;color:var(--muted);font-style:italic}
.ptabs{margin:6px 0 10px}
.mgrs{margin:2px 0 6px}
fieldset.mgrs{border:0;padding:0;margin:10px 0}
fieldset.mgrs legend{font-weight:600;margin-bottom:4px}
.mgrpanel{margin:6px 0 12px}
.status.expired{color:var(--cran-2)}
.guide ol{padding-left:22px;margin:8px 0}.guide li{margin:0 0 8px;font-size:15px}
#music .mbtn{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 74px);z-index:45;background:var(--pine);color:#fff;border:2px solid var(--gold);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;min-height:40px;box-shadow:0 4px 12px rgba(22,38,30,.25)}
/* 0.6.2 festive effects: decorative only, never take a tap, removed after a few seconds. */
.fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx .flake{position:absolute;top:-40px;color:#fff;text-shadow:0 0 2px rgba(22,38,30,.6);animation-name:fall;animation-timing-function:linear;animation-fill-mode:both;will-change:transform}
@keyframes fall{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--drift),calc(100vh + 80px)) rotate(200deg)}}
.fx .gift{position:absolute;top:-60px;line-height:1;animation-name:giftfall;animation-timing-function:ease-in;animation-fill-mode:both;will-change:transform,opacity}
/* 0.7.0: presents fall all the way to the bottom edge, squash as they land, then pop into confetti */
@keyframes giftfall{0%{transform:translateY(0) rotate(0);opacity:1}72%{transform:translateY(calc(100vh + 10px)) rotate(var(--spin));opacity:1}80%{transform:translateY(calc(100vh + 16px)) rotate(var(--spin)) scale(1.2,.75);opacity:1}88%{transform:translateY(calc(100vh + 4px)) rotate(var(--spin)) scale(1.3);opacity:1}100%{transform:translateY(calc(100vh + 4px)) rotate(var(--spin)) scale(.1);opacity:0}}
.fx .burst{position:absolute;bottom:34px;width:0;height:0;margin-left:18px}
.fx .confetti{position:absolute;left:-4px;top:-6px;width:8px;height:12px;border-radius:1px;animation-name:confetti;animation-duration:2.2s;animation-fill-mode:both;will-change:transform,opacity}
.fx .confetti.round{width:9px;height:9px;border-radius:50%}
@keyframes confetti{0%{transform:translate(0,0) rotate(0) scale(.3);opacity:0;animation-timing-function:ease-out}4%{opacity:1}35%{transform:translate(var(--dx),var(--up)) rotate(var(--r1)) scale(1);opacity:1;animation-timing-function:ease-in}85%{opacity:1}100%{transform:translate(var(--dx2),var(--down)) rotate(var(--r2)) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}

.setup{max-width:520px;margin:0 auto;padding:40px 20px 60px}
.setup .brand{color:var(--pine);font-size:50px;margin-bottom:6px}
.lede{font-size:17px;margin:0 0 26px;color:var(--ink)}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--frost);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.choice strong{display:block;font-size:17px}
.choice span{color:var(--muted);font-size:14px;display:block}
.errbox{background:#FBE7EA;color:#6B1222;border-radius:10px;padding:10px 12px;margin:0 0 14px;font-size:15px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ================= 0.9.0 Appearance ================= */
.themes{display:grid;gap:10px;margin:0 0 6px}
.tcard{border:1px solid var(--frost);border-radius:12px;padding:10px 12px;background:var(--paper)}
.tcard.on{border-color:var(--cran);box-shadow:0 0 0 1px var(--cran) inset}
.tcard .sw{display:flex;gap:5px;margin-bottom:8px}
.tcard .sw i{width:26px;height:26px;border-radius:6px;border:1px solid rgba(0,0,0,.12)}
.tcard .tinfo strong{display:block;font-size:16px}
.tcard .tinfo span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.tcard .actions{margin-top:10px}
.seg-row{gap:6px}
.btn.seg{padding:7px 12px;min-height:38px;font-size:14px}
.btn.seg.on{background:var(--pine);border-color:var(--pine);color:#fff;font-weight:600}

/* ================= 0.9.0 Manage Family ================= */
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:2px 8px;vertical-align:2px}
.plist li.mrow{display:block}
.plist li.mrow .grow{display:flex;flex-direction:column;gap:2px}
.plist li.mrow .sub{color:var(--muted);font-size:14px}
.plist li.mrow .actions{margin-top:8px}

/* ================= 0.9.0 THEME SYSTEM =================
   A theme changes colour, decoration and animation ONLY. Layout, navigation, forms, wish cards and
   every workflow are identical in all five, so nothing has to be relearned when the theme changes.
   Every decorative layer is position:fixed, pointer-events:none and aria-hidden, so no animation can
   ever cover or swallow a button, a field or a dialog. All of it is skipped under reduced motion. */
:root[data-theme="cozy"]{
  --pine:#243528; --ink:#20180F; --muted:#6B5744; --snow:#F6EFE3; --frost:#E4D7C3; --paper:#FFFBF4;
  --cran:#9C2B2B; --cran-2:#7A1F1F; --gold:#E0A83C; --gold-ink:#5E4310; --ok:#3F6B45;
}
:root[data-theme="snowman"]{
  --pine:#2B4E63; --ink:#17262F; --muted:#54707F; --snow:#F2F8FB; --frost:#D5E6EF; --paper:#FFFFFF;
  --cran:#C0392B; --cran-2:#93281C; --gold:#5FA8C9; --gold-ink:#1C4457; --ok:#2F7A63;
}
:root[data-theme="sledding"]{
  --pine:#1E4A56; --ink:#14252B; --muted:#4F7481; --snow:#EEF7F9; --frost:#CFE4E9; --paper:#FFFFFF;
  --cran:#D2492A; --cran-2:#A3361D; --gold:#F0A500; --gold-ink:#5A3F00; --ok:#2E7059;
}
:root[data-theme="santa"]{
  --pine:#123B2A; --ink:#12231A; --muted:#456B57; --snow:#F4F8F4; --frost:#D8E7DC; --paper:#FFFFFF;
  --cran:#C1121F; --cran-2:#8E0D17; --gold:#F2C14E; --gold-ink:#5E4400; --ok:#2B7A4B;
}

/* Header decoration: a string of lights under the app bar. Purely a background, 6px tall. */
:root[data-theme="cozy"] .top,
:root[data-theme="santa"] .top{box-shadow:inset 0 -6px 0 -2px rgba(0,0,0,.12)}
.lights{position:absolute;left:0;right:0;bottom:0;height:14px;pointer-events:none;overflow:hidden}
.lights i{position:absolute;top:3px;width:7px;height:10px;border-radius:50% 50% 60% 60%;opacity:.95;
  animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.45;filter:brightness(.8)}50%{opacity:1;filter:brightness(1.5)}}

/* ---- decorative layers (shared) ---- */
.deco{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.deco.front{z-index:41}
.amb{position:fixed;left:0;right:0;pointer-events:none;z-index:41;overflow:hidden;height:38px}
/* 0.9.1: the app bar grows a 38px strip that holds nothing but a snowbank; the chase gags run in it and
   nowhere else, so they can never be drawn over a button, a list, a form or a dialog. */
:root[data-runway="1"] .top{padding-bottom:52px;
  background-image:linear-gradient(to top,rgba(255,255,255,.18) 0 5px,rgba(255,255,255,.06) 5px 7px,transparent 7px)}
.amb.runway .stage{position:absolute;left:0;bottom:0;width:200%;height:200%;transform:scale(.5);transform-origin:0 100%}
.runner.fast .leg{animation-duration:.14s}
.bub{position:absolute;background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  border-radius:12px;padding:5px 10px;font-size:13px;font-weight:700;white-space:nowrap;
  box-shadow:0 2px 6px rgba(0,0,0,.2)}
.bub::after{content:"";position:absolute;left:14px;bottom:-9px;width:0;height:0;
  border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes bubpop{0%{transform:scale(.4);opacity:0}12%{transform:scale(1.08);opacity:1}20%{transform:scale(1)}
  86%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
.bub{animation:bubpop 2.6s ease-out both}

/* ---- the opening scene ---- */
#intro{position:fixed;inset:0;z-index:48;pointer-events:none;overflow:hidden;background:var(--introbg,transparent)}
#intro .scene{position:absolute;inset:0}
#intro.fade{animation:introout .7s ease-in .1s both}
@keyframes introout{to{opacity:0}}
.ground{position:absolute;left:-5%;right:-5%;bottom:0;height:22%;background:#fff;border-radius:50% 50% 0 0/22% 22% 0 0}

/* Cozy house */
.house{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);width:200px}
.house .body{position:absolute;bottom:0;left:20px;width:160px;height:96px;background:#6B4A32;border-radius:4px}
.house .roof{position:absolute;bottom:92px;left:0;width:0;height:0;border-left:100px solid transparent;
  border-right:100px solid transparent;border-bottom:62px solid #F2F5F7}
.house .win{position:absolute;width:34px;height:30px;background:#FFD98A;border:3px solid #4A3221;border-radius:3px;
  box-shadow:0 0 18px 6px rgba(255,200,110,.55);animation:glow 4.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 14px 4px rgba(255,200,110,.45)}50%{box-shadow:0 0 24px 9px rgba(255,205,120,.7)}}
.house .w1{bottom:38px;left:42px} .house .w2{bottom:38px;left:124px}
.house .door{position:absolute;bottom:0;left:86px;width:30px;height:52px;background:#8C5A33;border:3px solid #4A3221;border-radius:4px 4px 0 0}
.house .wreath{position:absolute;bottom:26px;left:92px;width:18px;height:18px;border:4px solid #2F6B3C;border-radius:50%}
.house .chim{position:absolute;bottom:128px;left:140px;width:20px;height:34px;background:#7A4B3A}
.smoke{position:absolute;bottom:162px;left:146px;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.55);
  animation:smoke 4.5s linear infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:.7}100%{transform:translate(26px,-90px) scale(2.4);opacity:0}}
.lantern{position:absolute;bottom:12%;width:12px;height:16px;background:#FFD98A;border-radius:3px;
  box-shadow:0 0 16px 6px rgba(255,205,120,.5)}
.tree{position:absolute;bottom:16%;width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;border-bottom:64px solid #2F6B3C}

/* Snowman */
.sman{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);width:120px;height:170px;
  animation:bobble 3.6s ease-in-out infinite}
@keyframes bobble{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}
.sman .ball{position:absolute;left:50%;transform:translateX(-50%);background:#fff;border-radius:50%;
  box-shadow:inset -6px -6px 12px rgba(180,200,215,.5)}
.sman .b1{bottom:0;width:100px;height:100px} .sman .b2{bottom:82px;width:74px;height:74px}
.sman .b3{bottom:142px;width:54px;height:54px}
.sman .eye{position:absolute;bottom:172px;width:7px;height:7px;background:#20303A;border-radius:50%}
.sman .e1{left:44px} .sman .e2{left:66px}
.sman .nose{position:absolute;bottom:162px;left:56px;width:0;height:0;border-top:5px solid transparent;
  border-bottom:5px solid transparent;border-left:22px solid #E8833A}
.sman .smile{position:absolute;bottom:150px;left:45px;width:28px;height:12px;border-bottom:3px solid #20303A;border-radius:0 0 40% 40%}
.sman .hat{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);width:56px;height:10px;background:#8E1B2B;border-radius:3px}
.sman .hat::before{content:"";position:absolute;bottom:8px;left:9px;width:38px;height:26px;background:#8E1B2B;border-radius:6px 6px 0 0}
.sman .hat::after{content:"";position:absolute;bottom:30px;left:20px;width:16px;height:16px;background:#fff;border-radius:50%}
.sman .scarf{position:absolute;bottom:134px;left:50%;transform:translateX(-50%);width:62px;height:13px;background:#C0392B;border-radius:4px}
.sman .tail{position:absolute;bottom:106px;left:74px;width:14px;height:34px;background:#C0392B;border-radius:4px;
  transform-origin:top center;animation:sway 2.8s ease-in-out infinite}

/* Reservation status. Firestore holds exactly one of these two strings: resDoc() writes them and firestore.rules

  if(!isStr(r.wishId, 40) || !r.wishId) return 'has no wish';
  if(!isStr(r.byMemberId, 40) || !r.byMemberId) return 'has no shopper';
  if(r.status !== RES.RESERVED && r.status !== RES.PURCHASED) return 'has an unknown status';

function buildSnapshot(rawMembers, rawWishes, resByOwner, unknownOwners, hiddenOwners, meId, family, ideasIn){
  const members = [];
  for(const m0 of rawMembers){
    const m = normMember(m0); const bad = badMember(m);
    if(bad){ Diag.unexp('Person record ' + m.id + ' ' + bad + '.'); continue; }
    members.push(m); Diag.inc();
  }
  /* 0.9.0: removed people stay in byId so their wishes and anyone's reservations on them still
     resolve, but they are kept out of the active family list the app renders. */
  const byId = {}; members.forEach(m => { byId[m.id] = m; });
  const removed = members.filter(isRemoved);
  const active = members.filter(m => !isRemoved(m));
  const wishes = [];
  for(const w0 of rawWishes){
    const w = normWish(w0); const bad = badWish(w);
    if(bad){ Diag.unexp('Wish "' + String(w0.title || w0.id).slice(0, 60) + '" ' + bad + '.'); continue; }
    if(!byId[w.ownerId]){ Diag.unexp('Wish "' + w.title.slice(0, 60) + '" belongs to someone not in the family list.'); continue; }
    wishes.push(w); Diag.inc();
  }
  wishes.sort((a, b) => b.createdAt - a.createdAt);
  const wishIds = new Set(wishes.map(w => w.id));
  for(const oid of hiddenOwners){
    const m = byId[oid];
    Diag.exp('Reservations on ' + (oid === meId ? 'your' : (m ? m.name + '’s' : 'one')) + ' list were not loaded on this phone (surprise protection).');
  }
  for(const oid of Object.keys(unknownOwners)){
    const m = byId[oid];
    Diag.unexp('Could not load reservations for ' + (m ? m.name : oid) + ': ' + unknownOwners[oid]);
  }
  const res = {}; const orphans = [];
  for(const oid of Object.keys(resByOwner)){
    for(const r of resByOwner[oid]){
      const bad = badRes(r);
      if(bad){ Diag.unexp('A reservation on ' + (byId[oid] ? byId[oid].name + '’s' : 'a') + ' list ' + bad + '.'); continue; }
      if(!wishIds.has(r.wishId)){
        if(r.byMemberId === meId){ orphans.push(r); Diag.exp('"' + String(r.wishTitle || 'A wish').slice(0, 60) + '" was removed from its list after you reserved it. Shown under Shopping.'); }
        else Diag.exp('Someone else’s reservation for a removed wish was ignored.');
        continue;
      }
      res[r.wishId] = r; Diag.inc();
    }
  }
  let hold = {known: false, hours: null, setBy: null, isDefault: false};
  if(family && family.ok){
    const d = family.data || {};
    if(d.holdHours === undefined || d.holdHours === null) hold = {known: true, hours: HOLD_DEFAULT, setBy: null, isDefault: true};
    else if(Number.isInteger(d.holdHours) && d.holdHours >= 0 && d.holdHours <= 720)
      hold = {known: true, hours: d.holdHours, setBy: typeof d.holdSetBy === 'string' ? d.holdSetBy : null, isDefault: false};
    else Diag.unexp('The family’s hold setting has an impossible value (' + String(d.holdHours).slice(0, 20) + '). No reservation is treated as run out until it is changed in Settings.');
  } else {
    Diag.unexp('Could not load the family’s hold setting' + (family && family.error ? ': ' + family.error : '') + '. No reservation is treated as run out until it loads.');
  }
  /* 0.9.0: how many organizers the family believes it has. Unknown (not merely zero) when the family
     record would not load, so the app never offers to claim organizer on a guess. */
  let org = {known: false, count: 0, bootstrap: false};
  if(family && family.ok){
    const c = (family.data || {}).organizerCount;
    /* 0.9.1: only an ABSENT count means "never had an organiser". A stored null is not 0 to the rules
       (data.get('organizerCount', 0) returns the stored null), so it is reported as impossible below
       instead of being offered as a claim the server would refuse. */
    if(c === undefined) org = {known: true, count: 0, bootstrap: true};
    else if(Number.isInteger(c) && c >= 0 && c <= 50) org = {known: true, count: c, bootstrap: c === 0};
    else Diag.unexp('The family record has an impossible organizer count (' + String(c).slice(0, 20) + '). Manage Family is switched off until it is fixed.');
  }
  if(removed.length) Diag.exp(removed.length + ' person record' + (removed.length === 1 ? '' : 's') + ' removed from the family are kept, with their lists, under Manage Family, Removed members.');
  /* 0.10.0: Gift Ideas. ideasIn is absent (older callers) or {live, viewer, byOwner, resByOwner, unknown}.
     Recipients whose ideas were not requested are simply absent: nothing is logged about them, because
     even "your ideas were not loaded" would tell a recipient the secret list exists. */
  const ix = ideasIn || {live: false, viewer: null, byOwner: {}, resByOwner: {}, unknown: {}};
  const ideas = [], ideaRes = {};
  for(const oid of Object.keys(ix.byOwner || {})){
    if(oid === meId) continue;
    for(const d of ix.byOwner[oid]){
      const i = normIdea(d, oid); const bad = badIdea(i);
      if(bad){ Diag.unexp('A gift idea for ' + (byId[oid] ? byId[oid].name : 'someone') + ' ' + bad + '.'); continue; }
      if(!byId[oid]){ Diag.unexp('A gift idea is for someone not in the family list.'); continue; }
      ideas.push(i); Diag.inc();
    }
  }
  ideas.sort((a, b) => b.createdAt - a.createdAt);
  const ideaIds = new Set(ideas.map(i => i.id));
  for(const oid of Object.keys(ix.resByOwner || {})){
    if(oid === meId) continue;
    for(const r0 of ix.resByOwner[oid]){
      const r = Object.assign({}, r0, {kind: 'idea'}); const bad = badRes(r);
      if(bad){ Diag.unexp('A reservation on a gift idea for ' + (byId[oid] ? byId[oid].name : 'someone') + ' ' + bad + '.'); continue; }
      if(!ideaIds.has(r.wishId)){
        if(r.byMemberId === meId){ orphans.push(r); Diag.unexp('"' + String(r.wishTitle || 'A gift idea').slice(0, 60) + '" is reserved by you but the idea itself could not be loaded. Shown under Shopping.'); }
        else Diag.exp('Someone else\u2019s reservation for a gift idea that is not loaded was ignored.');
        continue;
      }
      ideaRes[r.wishId] = r; Diag.inc();
    }
  }
  const ideaUnknown = Object.keys(ix.unknown || {}).filter(oid => oid !== meId);
  ideaUnknown.forEach(oid => Diag.unexp('Could not load gift ideas for ' + (byId[oid] ? byId[oid].name : oid) + ': ' + ix.unknown[oid]));
  if(ideasIn && ix.live === false) Diag.exp('Gift Ideas are switched off: the family server does not have the version 0.10.0 rules yet.');
  return { members: active, removed, allMembers: members, wishes, res, orphans,
    unknown: Object.keys(unknownOwners), hold, org, loadedAt: Date.now(),
    ideas, ideaRes, ideaUnknown, ideasLive: ix.live === true, ideasViewer: ix.viewer || null };
}

/* ================= 0.9.1 organiser-claim checks =================
   One pure function, used both to decide whether to SHOW "Become the family organiser" and, with fresh
   server reads, right before the claim is written. Each check is one condition the server's bootstrap
   rule (firebase/firestore.rules, bootstrapClaim + countUpdate) depends on, in the order a person
   would fix them. Sign-in ids are never shown; a short fingerprint lets two of them be compared. */
const RULES_PROBE = 'uttRulesProbe/organizer-admin-1';

const RULES_PROBE_ADMIN2 = 'uttRulesProbe/organizer-admin-2';
/* 0.10.0: allowed only by rules that carry secret Gift Ideas and member-id list managers. */
const RULES_PROBE_IDEAS = 'uttRulesProbe/gift-ideas-1';

const RULES_PROBE_CHILD = 'uttRulesProbe/child-claim-1';

  for(let i = 0; i < v.length; i++){ h ^= v.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }

function orgClaimChecks(x){
  const checks = [];
  const add = (id, ok, text) => checks.push({id, ok: !!ok, text: ok ? '' : text});
  const nm = id => (x.names && x.names[id]) ? x.names[id] : (id ? 'person ' + id : 'nobody');
  const mid = x.memberId, mem = x.member, fam = x.family;
  add('SIGNED_IN', !!x.uid, 'This phone is not signed in to the server.');
  add('ACCESS_RECORD', x.accessRead && x.accessRead.ok && !!x.accessRead.doc,
    'The server has no access record for this phone\u2019s sign-in in this family' +
    (x.accessRead && x.accessRead.error ? ' (' + x.accessRead.error + ')' : '') + '.');
  add('ACCESS_PICKED', typeof mid === 'string' && !!mid, 'This phone\u2019s access record does not say who is using it. Pick yourself first.');
  add('ACCESS_MATCHES_PHONE', !!mid && mid === x.localMeId,
    'This phone is set to ' + nm(x.localMeId) + ', but the server\u2019s access record says it is ' + nm(mid) + '. Refresh, then pick the right person.');
  add('MEMBER_RECORD', !!mem, 'The person this phone\u2019s access record names (' + nm(mid) + ') is not in the family' +
    (x.memberRead && x.memberRead.error ? ' (' + x.memberRead.error + ')' : '') + '.');
  const mUid = mem ? mem.uid : undefined;
  add('MEMBER_LINKED', !!mem && typeof mUid === 'string' && mUid === x.uid,
    !mem ? 'There is no person record to check.' :
    (typeof mUid !== 'string' || !mUid) ? nm(mid) + '\u2019s person record is not linked to any phone. Pick yourself again on this phone.' :
    nm(mid) + '\u2019s person record is linked to a different sign-in (' + fp(mUid) + '), not this phone\u2019s (' + fp(x.uid) + '). Pick yourself again on this phone.');
  const st = mem ? (mem.status === undefined ? 'active' : mem.status) : undefined;
  add('MEMBER_ACTIVE', st === 'active', mem ? nm(mid) + ' is marked ' + String(st) + ' in the family group, not active.' : 'There is no person record to check.');
  add('NOT_ALREADY_ORGANISER', !!mem && mem.role !== 'organizer', mem ? nm(mid) + ' is already an organiser.' : 'There is no person record to check.');
  const c = fam ? fam.organizerCount : undefined;
  add('FAMILY_HAS_NO_ORGANISER', !!fam && (c === undefined || c === 0),
    !fam ? 'The family record could not be read' + (x.familyRead && x.familyRead.error ? ' (' + x.familyRead.error + ')' : '') + '.' :
    (Number.isInteger(c) && c > 0) ? 'The family already has ' + (c === 1 ? 'an organiser' : c + ' organisers') + '. Refresh to see who.' :
    'The family\u2019s organiser count is unreadable (' + String(c).slice(0, 20) + '), so the server would refuse.');
  const rl = x.rules || {live: null, detail: 'not checked'};
  add('SERVER_RULES', rl.live === true, rl.live === false
    ? 'The server\u2019s security rules are older than version 0.9.1, so it would refuse this claim. Nothing is wrong on this phone: the rules in firebase/firestore.rules from the 0.9.1 source need publishing to the Firebase project.'

  const first = checks.find(k => !k.ok) || null;
  return {ok: !first, first, checks, rulesDetail: rl.detail || '',
    facts: {signIn: fp(x.uid), accessPerson: mid ? nm(mid) : 'none', phonePerson: x.localMeId ? nm(x.localMeId) : 'none',
      personLinkedTo: mem ? fp(typeof mUid === 'string' ? mUid : '') : 'no record', personStatus: mem ? String(st) : 'no record',
      personRole: mem ? String(mem.role || 'member') : 'no record', familyOrganiserCount: fam ? (c === undefined ? 'absent' : String(c)) : 'unreadable',
      serverRules: rl.live === true ? '0.9.1 or later' : rl.live === false ? 'older than 0.9.1' : 'unknown'}};
}

/* ================= Firestore (REST, no SDK) ================= */
function toValue(v){
  if(v === null || v === undefined) return {nullValue: null};
  if(v instanceof Date) return {timestampValue: v.toISOString()};
  if(typeof v === 'boolean') return {booleanValue: v};
  if(typeof v === 'number') return Number.isInteger(v) ? {integerValue: String(v)} : {doubleValue: v};
  if(typeof v === 'string') return {stringValue: v};
  if(Array.isArray(v)) return {arrayValue: {values: v.map(toValue)}};
  if(typeof v === 'object') return {mapValue: {fields: toFields(v)}};
  throw new AppError('BAD_VALUE', 'Tried to save a value Firestore cannot store.');
}
function toFields(o){ const f = {}; for(const k of Object.keys(o)) if(o[k] !== undefined) f[k] = toValue(o[k]); return f; }
function fromValue(v){
  if(!v || typeof v !== 'object') return undefined;
  if('nullValue' in v) return null;
  if('booleanValue' in v) return v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return v.doubleValue;
  if('stringValue' in v) return v.stringValue;
  if('timestampValue' in v) return Date.parse(v.timestampValue);
  if('arrayValue' in v) return (v.arrayValue.values || []).map(fromValue);
  if('mapValue' in v) return fromFields(v.mapValue.fields || {});

}
function fromFields(f){ const o = {}; for(const k of Object.keys(f || {})) o[k] = fromValue(f[k]); return o; }

const SERVER_BROKEN = code => 'The Under the Tree server isn’t set up correctly right now (' + code + '). This isn’t something you can fix on your phone. Try again later; if it keeps happening, tell whoever gave you the app.';
const SERVER_OLD_MSG = 'The Under the Tree server hasn’t been updated for version 0.8.0 yet. Nothing is lost. Try again later.';
const NOT_IN_FAMILY_MSG = 'The server no longer lists this phone as part of this family. Nothing is deleted. Ask someone in the family for an invite code (Settings, Share invite), then choose Start over on this phone and Join my family.';
const BAD_INVITE_MSG = 'That invite code doesn’t work. It may have been replaced by a newer one. Ask for a fresh invite code.';
const OLD_INVITE_MSG = 'This invite code is from an older version of Under the Tree and no longer works. Ask the person who sent it for a new one (Settings, Share invite).';
function fsError(status, data){
  const e = ((Array.isArray(data) ? data[0] : data) || {}).error || {};
  const st = e.status || ''; const msg = e.message || ('HTTP ' + status);
  if(st === 'PERMISSION_DENIED' && /API has not been used|is disabled/i.test(msg))
    return new AppError('API_OFF', SERVER_BROKEN('API_OFF'), msg);
  if(st === 'PERMISSION_DENIED')
    return new AppError('PERMISSION_DENIED', 'The server refused this. Tap Refresh and try again. Details are in Settings, Diagnostics.', msg);
  if(st === 'NOT_FOUND' && /does not exist for project/i.test(msg))
    return new AppError('NO_DATABASE', SERVER_BROKEN('NO_DATABASE'), msg);
  if(st === 'NOT_FOUND') return new AppError('NOT_FOUND', 'That item no longer exists. Refresh to see the latest.', msg);
  if(st === 'ALREADY_EXISTS' || st === 'FAILED_PRECONDITION' || st === 'ABORTED')
    return new AppError('CONFLICT', 'Someone changed this at the same moment. Refresh and try again.', msg);
  if(st === 'UNAUTHENTICATED') return new AppError('AUTH', 'Sign-in expired and could not be renewed. Close and reopen the app.', msg);
  if(st === 'RESOURCE_EXHAUSTED') return new AppError('QUOTA', 'The Under the Tree server reached its free daily limit. It resets at midnight Pacific time.', msg);
  return new AppError('FIREBASE', 'The server returned an error: ' + msg, msg);
}
function authError(data){
  const msg = (data && data.error && data.error.message) || 'no details';
  if(/OPERATION_NOT_ALLOWED|ADMIN_ONLY_OPERATION/.test(msg))
    return new AppError('ANON_OFF', SERVER_BROKEN('ANON_OFF'), msg);
  if(/API_KEY_INVALID|API key not valid/i.test(msg))
    return new AppError('BAD_KEY', SERVER_BROKEN('BAD_KEY'), msg);
  if(/CONFIGURATION_NOT_FOUND/.test(msg))
    return new AppError('NO_AUTH', SERVER_BROKEN('NO_AUTH'), msg);
  if(/TOKEN_EXPIRED|INVALID_REFRESH_TOKEN|USER_NOT_FOUND|USER_DISABLED/.test(msg))
    return new AppError('SESSION_LOST', 'This phone’s sign-in is no longer valid.', msg);
  return new AppError('AUTH_FAIL', 'Signing in to the server failed: ' + msg, msg);
}

class FirestoreBackend {
  constructor(cfg){
    this.cfg = cfg; this.kind = 'firebase';
    /* 0.8.0 families save no server settings. 0.6/0.7 phones saved projectId + apiKey; for the shared server the
       built-in key wins, otherwise the saved one is kept so an existing install never loses its connection. */
    this.projectId = cfg.projectId || BACKEND.projectId;
    this.apiKey = (this.projectId === BACKEND.projectId && keyLooksReal(BACKEND.apiKey)) ? BACKEND.apiKey : (cfg.apiKey || '');
    this.base = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(this.projectId) + '/databases/(default)/documents';
    this.root = 'projects/' + this.projectId + '/databases/(default)/documents';

    this.keyCheck();

      {'Content-Type': 'application/json'}, JSON.stringify({returnSecureToken: true}));

    if(r.status >= 400 || !d || !d.idToken) throw authError(d);
    this.auth = { projectId: this.projectId, uid: d.localId, idToken: d.idToken, refreshToken: d.refreshToken,
      expiresAt: Date.now() + (Number(d.expiresIn) || 3600) * 1000 };
    writeJSON(K.auth, this.auth);
  }

    this.keyCheck();

      {'Content-Type': 'application/x-www-form-urlencoded'}, 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(this.auth.refreshToken));
    const d = parseJSON(r.body);
    if(r.status >= 400 || !d || !d.id_token) throw authError(d);
    this.auth = Object.assign({}, this.auth, { uid: d.user_id || this.auth.uid, idToken: d.id_token,
      refreshToken: d.refresh_token || this.auth.refreshToken, expiresAt: Date.now() + (Number(d.expires_in) || 3600) * 1000 });
    writeJSON(K.auth, this.auth);

    const t = await this.token();
    const r = await Platform.http(method, url, {'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json'},
      bodyObj ? JSON.stringify(bodyObj) : null);
    if(r.status === 401 && !retried){ this.auth.expiresAt = 0; return this.api(method, url, bodyObj, true); }
    const data = r.body ? parseJSON(r.body) : {};
    if(data === null) throw new AppError('BAD_REPLY', 'The server sent an unreadable reply (HTTP ' + r.status + ').');
    if(r.status >= 400) throw fsError(r.status, data);

  idOf(doc){ return String(doc.name || '').split('/').pop(); }

  put(path, obj, mustExist, opts){

    catch(e){ const err = asAppError(e); if(err.code === 'PERMISSION_DENIED') throw new AppError('SERVER_OLD', SERVER_OLD_MSG, err.detail); throw err; }
    if(!d) return null;
    const a = fromFields(d.fields || {});

  async ensureAccess(){
    const a = await this.getAccess();
    if(a){ this.access = a; return a; }

      try {
        await this.commit([this.put(this.accessPath(), {memberId: this.cfg.meId, via: 'upgrade'}, false, {stamp: 'joinedAt'})]);
        this.access = {memberId: this.cfg.meId, via: 'upgrade'};

    try { await this.commit([this.put(this.accessPath(), {memberId: null, via: 'invite', invite: code}, false, {stamp: 'joinedAt'})]); }
    catch(e){ const err = asAppError(e); if(err.code === 'PERMISSION_DENIED') throw new AppError('BAD_INVITE', BAD_INVITE_MSG, err.detail); throw err; }

  async leaveFamily(){ await this.commit([{delete: this.docName(this.accessPath())}]); this.access = null; }

  async listAccess(){
    const docs = await this.listCollection(this.fam() + '/access');
    return docs.map(d => {

  async rulesProbe(){
    try { await this.api('GET', this.base + '/' + RULES_PROBE); return {live: true, detail: 'probe readable'}; }
    catch(e){
      const err = asAppError(e);
      if(err.code === 'NOT_FOUND') return {live: true, detail: 'probe allowed (not found)'};
      if(err.code === 'PERMISSION_DENIED') return {live: false, detail: 'probe refused: ' + String(err.detail || '').slice(0, 160)};
      return {live: null, detail: err.code + ': ' + String(err.detail || err.message).slice(0, 160)};
    }

  /* 0.9.1: read one document for a check. A refusal or failure becomes a failed check, never a crash. */
  async readForCheck(path){

  }
  /* 0.9.1: every relationship the server's bootstrap rule depends on, read FRESH from the server -

  async orgPreflight(localMeId, names){
    await this.token();
    const acc = await this.readForCheck(this.accessPath());
    const access = acc.doc ? fromFields(acc.doc.fields || {}) : null;
    const mid = access && typeof access.memberId === 'string' ? access.memberId : null;
    const mem = acc.doc && mid ? await this.readForCheck(this.fam() + '/members/' + mid) : {ok: true, doc: null, skipped: true};
    const fam = acc.doc ? await this.readForCheck(this.fam()) : {ok: false, doc: null, error: 'not read: no access record'};
    const rules = await this.rulesProbe();
    const r = orgClaimChecks({
      uid: this.uid, accessRead: acc, access, localMeId: localMeId || null, memberId: mid,
      memberRead: mem, member: mem.doc ? fromFields(mem.doc.fields || {}) : null,
      familyRead: fam, family: fam.doc ? fromFields(fam.doc.fields || {}) : null, rules, names: names || {}});
    r.memberId = mid;
    r.famUpdateTime = fam.doc && fam.doc.updateTime ? fam.doc.updateTime : null;

  /* C. The one legacy bootstrap. A linked, active member of a family with no organizer makes ITSELF

     so two phones racing cannot both win even for a moment. The rules still refuse a second claim. */
  async claimOrganizer(localMeId, names){
    const pre = await this.orgPreflight(localMeId, names);
    if(!pre.ok){ const e = new AppError('ORG_CHECK', pre.first.text, 'check failed: ' + pre.first.id); e.report = pre; throw e; }
    try {
      await this.commit([
        this.put(this.fam() + '/members/' + pre.memberId, {role: 'organizer'}, true, {mask: true}),
        this.put(this.fam(), {organizerCount: 1}, true, pre.famUpdateTime ? {mask: true, updateTime: pre.famUpdateTime} : {mask: true})
      ]);
    } catch(e){ const err = asAppError(e); err.report = pre; throw err; }

  async mfCommit(tr, writes){
    if(tr){
      tr.step = 'commit';
      tr.writes = writes.map((w, i) => {
        const path = String(w.delete || (w.update && w.update.name) || '').replace(this.root + '/', '');
        return {n: i + 1, op: w.delete ? 'delete' : 'update', path,
          fields: w.update ? Object.keys(w.update.fields || {}).join(',') : ''};
      });

    await this.commit(writes);

  async mfAccessFor(tr, m){

    if(tr){
      tr.accessTotal = all.length;
      tr.accessFound = mine.length;
      tr.accessRecords = mine.map(a => ({signIn: fp(a.uid), names: a.memberId === m.id ? 'this person' : (a.memberId ? 'person ' + a.memberId : 'nobody picked'),

    }

  async demoteMember(m, count, tr){

  /* Organizer action: disconnect a member from the app. The phone link is cleared and every access

  async disconnectMember(m, tr){

    acc.forEach(a => w.push({delete: this.docName(this.fam() + '/access/' + a.uid)}));

  /* Organizer action: remove a member from the family group. Recoverable by design - the person

  async removeMember(m, meId, count, tr){
    const acc = await this.mfAccessFor(tr, m);

    const w = [this.put(this.fam() + '/members/' + m.id, fields, true, {mask: true})];

    catch(e){

  async getFamily(){ await this.token(); const d = await this.getDoc(this.fam()); return d ? fromFields(d.fields || {}) : null; }

      this.getDoc(this.fam()).then(d => d ? {ok: true, data: fromFields(d.fields || {})} : {ok: false, error: 'the family record was not found'},
        e => ({ok: false, error: asAppError(e).message})),
      this.listInvites().then(v => ({ok: true, list: v}), e => ({ok: false, error: asAppError(e).message}))]);
    const rawMembers = lists[0].map(d => Object.assign(fromFields(d.fields || {}), {id: this.idOf(d)}));
    const rawWishes = lists[1].map(d => Object.assign(fromFields(d.fields || {}), {id: this.idOf(d)}));
    const resByOwner = {}, unknown = {}, hidden = [];
    let unpicked = 0;
    await Promise.all(rawMembers.map(async m => {

      if(!myMid){ unpicked++; return; }

    if(myMid){
      const pr = await this.ideasProbe();

      if(pr.live === true){

          if(m.uid === this.uid || m.id === myMid) return;
          try {
            const two = await Promise.all([this.listCollection(this.ideasPath(m.id)), this.listCollection(this.fam() + '/hidden/' + m.id + '/ideaReservations')]);
            ideasIn.byOwner[m.id] = two[0].map(d => Object.assign(fromFields(d.fields || {}), {id: this.idOf(d)}));
            ideasIn.resByOwner[m.id] = two[1].map(d => fromFields(d.fields || {}));

    if(myMid && snap.claimLive === false) Diag.exp('Child setup codes are switched off: the family server does not have the version 0.10.1 rules yet.');
    /* 0.9.1: a family with no organiser. Decide - from what was just read from the server, plus the

    else { snap.invites = []; Diag.unexp('Could not load the family’s invite code: ' + lists[3].error); }

  /* claim: this phone is the new person. The person record and this phone's access record change in one batch.

  async addMember(name, opts){
    const mid = rid(12);
    const m = {name: name, uid: opts.claim ? this.uid : null, managers: opts.managed ? [this.uid] : [], createdAt: Date.now()};
    if(opts.managed && opts.meId) m.managerIds = [opts.meId];
    const w = [this.put(this.fam() + '/members/' + mid, m, false)];
    if(opts.claim) w.push(this.put(this.accessPath(), {memberId: mid, updatedAt: Date.now()}, true, {mask: true}));
    await this.commit(w);
    if(opts.claim) this.access = {memberId: mid, via: (this.access && this.access.via) || ''};
    const out = Object.assign({id: mid}, m); out.managerFailures = [];
    let ids = (m.managerIds || []).slice();
    for(const extra of (opts.extraManagers || [])){
      try { ids = await this.setManagers(out, ids.concat([extra])); }
      catch(e){ out.managerFailures.push({id: extra, error: asAppError(e)}); }

    out.managerIds = ids;

  }

/* ================= product-link lookup ================= */
const UA = 'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Mobile Safari/537.36';
const STORES = {amazon:'Amazon', walmart:'Walmart', target:'Target', bestbuy:'Best Buy', lego:'LEGO', etsy:'Etsy', ebay:'eBay',
  kohls:'Kohl’s', costco:'Costco', homedepot:'The Home Depot', lowes:'Lowe’s', macys:'Macy’s', gamestop:'GameStop',
  barnesandnoble:'Barnes & Noble', dickssportinggoods:'Dick’s Sporting Goods', michaels:'Michaels', joann:'JOANN',
  samsclub:'Sam’s Club', wayfair:'Wayfair', apple:'Apple', nike:'Nike', temu:'Temu', shein:'SHEIN', menards:'Menards', meijer:'Meijer'};
function trimUrl(s){ return s.replace(/[)\].,!?;:'"]+$/, ''); }
function extractUrl(text){ const m = String(text || '').match(/https?:\/\/[^\s<>"]+/i); return m ? trimUrl(m[0]) : ''; }
function normalizeUrl(raw){
  let s = String(raw || '').trim(); if(!s) return null;
  const m = s.match(/https?:\/\/[^\s<>"]+/i);
  if(m) s = trimUrl(m[0]);
  else if(/^[\w-]+(\.[\w-]+)+([/?#]|$)/.test(s)) s = 'https://' + s;
  let u; try { u = new URL(s); } catch(e){ return null; }
  if(u.protocol === 'http:') u.protocol = 'https:';
  if(u.protocol !== 'https:') return null;
  return u.toString();
}
function storeFromHost(url){
  try {
    const h = new URL(url).hostname.toLowerCase().replace(/^(www|m|smile|shop)\./, '');
    if(h === 'a.co' || h === 'amzn.to' || h === 'amzn.com') return 'Amazon';
    const parts = h.split('.');
    let key = parts.length >= 2 ? parts[parts.length - 2] : parts[0];
    if((key === 'co' || key === 'com') && parts.length >= 3) key = parts[parts.length - 3];
    return STORES[key] || (key.charAt(0).toUpperCase() + key.slice(1));
  } catch(e){ return ''; }
}
function ldNodes(j, out){
  out = out || [];
  if(!j) return out;
  if(Array.isArray(j)){ j.forEach(x => ldNodes(x, out)); return out; }
  if(typeof j === 'object'){ out.push(j); if(j['@graph']) ldNodes(j['@graph'], out); if(j.mainEntity) ldNodes(j.mainEntity, out); }
  return out;
}
function isType(n, t){ const ty = n['@type']; return Array.isArray(ty) ? ty.indexOf(t) >= 0 : ty === t; }
function firstImage(v){
  if(!v) return ''; if(typeof v === 'string') return v; if(Array.isArray(v)) return firstImage(v[0]);
  if(typeof v === 'object') return v.url || v.contentUrl || ''; return '';
}
function offerPrice(o){
  if(!o) return null;
  if(Array.isArray(o)){ for(const x of o){ const p = offerPrice(x); if(p) return p; } return null; }
  if(typeof o !== 'object') return null;
  const spec = Array.isArray(o.priceSpecification) ? o.priceSpecification[0] : o.priceSpecification;
  let amount = o.price; if(amount == null || amount === '') amount = o.lowPrice; if((amount == null || amount === '') && spec) amount = spec.price;
  if(amount == null || amount === '') return null;
  return {amount: String(amount), currency: o.priceCurrency || (spec && spec.priceCurrency) || ''};
}
function formatPrice(amount, currency){
  const n = Number(String(amount).replace(/[^0-9.]/g, ''));
  if(!isFinite(n) || n <= 0) return '';
  const cur = String(currency || 'USD').toUpperCase();
  return (cur === 'USD') ? '$' + n.toFixed(2) : n.toFixed(2) + ' ' + cur;
}
function cleanTitle(t, store){
  t = String(t || '').replace(/\s+/g, ' ').trim().replace(/^Amazon\.com\s*:\s*/i, '');
  const m = t.match(/^(.*\S)\s+[|:\-–—]\s+([^|:\-–—]{2,40})$/);
  if(m){ const tail = m[2].toLowerCase(); if(/\.com|\.net|\.org/.test(tail) || (store && tail.indexOf(store.toLowerCase()) >= 0)) t = m[1]; }
  return t.slice(0, 300);
}
function parseProduct(html, pageUrl, status){
  const out = {title: '', price: '', store: storeFromHost(pageUrl), imageUrl: '', found: [], missing: [], problem: '', status: status};
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const pageTitle = ((doc.querySelector('title') || {}).textContent || '').replace(/\s+/g, ' ').trim();
  const blocked = status === 403 || status === 429 || status === 503 ||
    /robot check|captcha|access denied|are you a (human|robot)|pardon our interruption|just a moment|attention required|verify you are human/i.test(pageTitle) ||
    !!doc.querySelector('form[action*="validateCaptcha"], #captcha, .g-recaptcha, #challenge-form, [data-hcaptcha-widget-id]');
  if(blocked){ out.problem = 'blocked'; return out; }
  if(status >= 400){ out.problem = status === 404 ? 'notfound' : 'http'; return out; }

  let product = null;
  for(const s of doc.querySelectorAll('script[type="application/ld+json"]')){
    const j = parseJSON((s.textContent || '').trim()); if(!j) continue;
    product = ldNodes(j).find(n => isType(n, 'Product') || isType(n, 'ProductGroup')) || null;
    if(product) break;
  }
  const meta = function(){
    for(const n of arguments){
      const el = doc.querySelector('meta[property="' + n + '"], meta[name="' + n + '"], meta[itemprop="' + n + '"]');
      const c = el && (el.getAttribute('content') || '').trim(); if(c) return c;
    }
    return '';
  };
  const site = meta('og:site_name');
  if(!STORES[(out.store || '').toLowerCase()] && site && site.length <= 40) out.store = site;

  let title = '';
  if(product && product.name){ title = String(product.name); }
  else title = meta('og:title', 'twitter:title') || pageTitle;
  out.title = cleanTitle(title, out.store);

  let p = null;
  if(product){
    p = offerPrice(product.offers);
    if(!p && Array.isArray(product.hasVariant)) for(const v of product.hasVariant){ p = offerPrice(v && v.offers); if(p) break; }
  }
  if(!p){
    const amt = meta('product:price:amount', 'og:price:amount');
    if(amt) p = {amount: amt, currency: meta('product:price:currency', 'og:price:currency')};
  }
  if(!p){
    const el = doc.querySelector('[itemprop="price"]');
    if(el){ const amt = (el.getAttribute('content') || el.textContent || '').trim(); if(amt) p = {amount: amt, currency: ''}; }
  }
  if(p) out.price = formatPrice(p.amount, p.currency);

  let img = product ? firstImage(product.image) : '';
  if(!img) img = meta('og:image:secure_url', 'og:image', 'twitter:image');
  if(img){ try { const u = new URL(img, pageUrl); if(u.protocol === 'https:' || u.protocol === 'http:') out.imageUrl = u.toString(); } catch(e){} }

  if(out.title) out.found.push('name'); else out.missing.push('name');
  if(out.price) out.found.push('price'); else out.missing.push('price');
  if(out.imageUrl) out.found.push('picture'); else out.missing.push('picture');
  if(out.store) out.found.push('store');
  if(!out.title) out.problem = 'nothing';
  return out;
}

  } finally {

  }
}

/* The one interpretation of a wish's reservation, for the person using this phone.
   'unknown' | 'available' | 'mine-reserved' | 'mine-bought' | 'other-reserved' | 'other-bought'.
   Reservations on this phone's own list are never loaded (load() skips them and firestore.rules refuse them),
   so this cannot reveal anything to a wish's owner. */
function shopState(w){
  if(unknownFor(w)) return 'unknown';
  const r = resFor(w);
  if(!r) return 'available';
  const mine = r.byMemberId === S.cfg.meId;
  if(r.status === RES.PURCHASED) return mine ? 'mine-bought' : 'other-bought';
  if(holdOver(r)) return mine ? 'mine-expired' : 'available';
  return mine ? 'mine-reserved' : 'other-reserved';
}
/* ---- 0.7.0 holds ----
   A reservation not marked bought goes back on the list after the family's hold time (Settings; default 48 hours).
   Firestore rules enforce it on Google's clock. This phone only decides what to show, and waits HOLD_GRACE_MS past the
   end so a slightly fast phone clock never offers a gift the rules would still refuse. Holds made before 0.7.0 carry no
   server time (heldAt) and never run out. If the hold setting could not be loaded, nothing is treated as run out. */
function holdHoursNow(){ const h = S.snap && S.snap.hold; return h && h.known ? h.hours : null; }
function holdEnds(r){
  const hh = holdHoursNow();
  if(!r || r.status !== RES.RESERVED || typeof r.heldAt !== 'number' || !isFinite(r.heldAt) || !hh) return null;
  return r.heldAt + hh * 3600000;
}
function holdOver(r){ const e = holdEnds(r); return e !== null && Date.now() > e + HOLD_GRACE_MS; }
function holdLabel(h){ return h === 0 ? 'never' : h === 168 ? '1 week' : h + ' hours'; }
function timeLeft(ms){
  const h = ms / 3600000;
  if(h < 1) return 'under an hour';
  if(h <= 72){ const n = Math.ceil(h); return n + (n === 1 ? ' hour' : ' hours'); }
  return 'about ' + Math.round(h / 24) + ' days';
}
function holdNote(w){
  const r = resFor(w); if(!r || r.status !== RES.RESERVED) return '';
  if(typeof r.heldAt !== 'number') return 'Reserved before version 0.7.0, so this hold doesn’t run out.';
  const e = holdEnds(r); if(e === null) return '';
  return 'Goes back on the list in ' + timeLeft(Math.max(0, e - Date.now())) + ' unless you mark it bought.';
}
function shopSummary(ws){
  const c = {available: 0, unknown: 0, 'mine-reserved': 0, 'mine-expired': 0, 'mine-bought': 0, 'other-reserved': 0, 'other-bought': 0};
  ws.forEach(w => { c[shopState(w)]++; });
  const others = c['other-reserved'] + c['other-bought'];
  return ', ' + c.available + ' still available' +
    (c['mine-reserved'] ? ', ' + c['mine-reserved'] + ' reserved by you' : '') +
    (c['mine-bought'] ? ', ' + c['mine-bought'] + ' bought by you' : '') +
    (c['mine-expired'] ? ', ' + c['mine-expired'] + (c['mine-expired'] === 1 ? ' hold' : ' holds') + ' of yours ran out' : '') +
    (others ? ', ' + others + ' taken by someone else' : '');
}
function shopperTag(w, owner){
  const st = shopState(w);
  let status, cls, acts = '';
  if(st === 'unknown'){ status = 'Status could not be loaded. Refresh before buying.'; cls = 'unknown'; }
  else if(st === 'available'){ status = resFor(w) ? 'Available. Someone’s hold ran out.' : 'Available'; cls = 'avail'; acts = btn('res:reserve', w.id, 'Reserve', 'primary'); }
  else if(st === 'mine-expired'){ status = 'Your hold ran out. It’s back on the list.'; cls = 'expired'; acts = btn('res:reserve', w.id, 'Reserve again', 'primary') + btn('res:bought', w.id, 'Mark bought') + btn('res:release', w.id, 'Release'); }
  else if(st === 'mine-reserved'){ status = 'Reserved by you'; cls = 'mine'; acts = btn('res:bought', w.id, 'Mark bought', 'primary') + btn('res:release', w.id, 'Release'); }
  else if(st === 'mine-bought'){ status = 'Bought by you'; cls = 'bought'; acts = btn('res:unbought', w.id, 'Undo bought') + btn('res:release', w.id, 'Release'); }
  else { status = st === 'other-bought' ? 'Someone already bought this' : 'Someone else reserved this'; cls = 'taken'; }
  if(w.kind === 'idea'){
    /* The suggester edits or removes an idea only while nobody holds it (the rules refuse otherwise, so a
       purchase can never be silently erased). An organiser may remove other people's available ideas. */
    const free = !resFor(w) && st !== 'unknown';
    if(free && w.suggestedBy === S.cfg.meId) acts += btn('idea:edit', w.id, 'Edit', 'quiet') + btn('idea:delete', w.id, 'Remove', 'quiet');
    else if(free && meIsOrganizer()) acts += btn('idea:delete', w.id, 'Remove (organiser)', 'quiet');
    const by = memberById(w.suggestedBy);
    return tagHtml(w, {to: owner.name, kindLabel: 'Gift idea', from: 'Suggested by ' + (w.suggestedBy === S.cfg.meId ? 'you' : by ? by.name : 'someone no longer listed'),
      status: status, statusCls: cls, actions: acts, dim: cls === 'taken', note: st === 'mine-reserved' ? holdNote(w) : ''});
  }
  if(iKeep(owner)) acts += btn('wish:edit', w.id, 'Edit', 'quiet') + btn('wish:delete', w.id, 'Remove', 'quiet');
  return tagHtml(w, {to: owner.name, status: status, statusCls: cls, actions: acts, dim: cls === 'taken', note: st === 'mine-reserved' ? holdNote(w) : ''});
}

function renderWishList(m){
  const all = S.snap.wishes.filter(w => w.ownerId === m.id);
  /* 0.6.2: once a wish is reserved or bought it leaves this list and lives only in the shopper's Shopping tab.
     Nothing is hidden that someone needs:

     - if reservations for this person could not load, every wish shows with the warning (never hide on unknown).
     This screen is never shown for your own list, and My list is unchanged, so it reveals nothing to an owner. */
  const keep = iKeep(m);
  const ws = all.filter(w => { const st = shopState(w); return keep || st === 'available' || st === 'unknown' || st === 'mine-expired'; });
  const rank = {available: 0, unknown: 0, 'mine-expired': 1, 'mine-reserved': 1, 'mine-bought': 1, 'other-reserved': 2, 'other-bought': 2};
  const order = w => rank[shopState(w)];
  ws.sort((a, b) => order(a) - order(b));
  let yours = 0, others = 0;
  if(!keep) all.forEach(w => { const st = shopState(w); if(st === 'mine-reserved' || st === 'mine-bought') yours++; else if(st === 'other-reserved' || st === 'other-bought') others++; });
  let h = '';

}
/* ---- Settings -> Appearance ----
   The theme choice is this phone's alone. It is never written to the family record, so two people in

function renderAppearance(){

    '<p class="hint">Christmas theme, on this phone only. The app works exactly the same in every theme \u2014 ' +

  const note = Platform.getItem(K.themeNote);
  if(note) h += '<p class="hint">This phone was using ' + esc(note) + '. That theme has been withdrawn while it is redesigned, so this phone now uses Classic Christmas.</p>';
  h += '<div class="themes">';
  offeredThemes().forEach(t => {
    const on = t.id === cur;
    h += '<div class="tcard' + (on ? ' on' : '') + '"><div class="sw">' +
      t.sw.map(c => '<i style="background:' + c + '"></i>').join('') + '</div>' +
      '<div class="tinfo"><strong>' + esc(t.name) + (on ? ' <span class="badge">In use</span>' : '') + '</strong>' +
      '<span>' + esc(t.blurb) + '</span></div><div class="actions">' +
      btn('theme:preview', t.id, 'Preview') +

  });
  h += '</div>';

  const sp = snowPref(), ap = ambPref(), dp = shopPref();

    '" data-act="' + act + '" data-id="' + val + '">' + label + '</button>';
  h += '<h3>Snow</h3><p class="hint">This theme normally uses ' + esc(snowLabel(theme().snow)) + '.</p><div class="actions seg-row">' +
    opt('set:snow', 'default', sp, 'Theme default') + opt('set:snow', 'on', sp, 'On') + opt('set:snow', 'off', sp, 'Off') + '</div>';
  h += '<h3>Ambient animation</h3><p class="hint">Small scenes that turn up now and then while you use the app. ' +
    (theme().amb ? 'This theme uses them.' : 'This theme has none, so Low and Normal have nothing to show.') + '</p><div class="actions seg-row">' +
    opt('set:amb', 'default', ap, 'Theme default') + opt('set:amb', 'off', ap, 'Off') +
    opt('set:amb', 'low', ap, 'Low') + opt('set:amb', 'normal', ap, 'Normal') + '</div>';
  h += '<h3>Shopping decorations</h3><p class="hint">On the Shopping screen only. Never over the wish cards.</p><div class="actions seg-row">' +
    opt('set:shop', 'default', dp, 'Theme default') + opt('set:shop', 'none', dp, 'None') +
    opt('set:shop', 'border', dp, 'Full border') + opt('set:shop', 'lights', dp, 'Dangling lights') + '</div>' +
    '<div class="actions">' + btn('shop:preview', '', 'Preview decoration') + '</div>';
  if(reducedMotion()) h += '<p class="hint">This phone asks apps to reduce motion, so animations and decorations are switched off whatever is chosen here.</p>';
  return h + '</section>';
}
function snowLabel(mode){
  return mode === 'off' ? 'no snow' : mode === 'light' ? 'a little snow' : mode === 'soft' ? 'soft snow'
    : mode === 'heavy' ? 'heavy snow' : 'snow';
}

/* 0.9.0: the one place that decides what a person's connection chip says, so Settings, Manage Family
   and Removed members can never disagree with each other. */
function connChip(p){
  const fb = S.cfg && S.cfg.mode === 'firebase';
  if(isRemoved(p)) return 'Removed';
  if(p.id === S.cfg.meId) return 'This phone';
  if(fb && p.uid) return 'Has the app';
  if(isChild(p)){ const kn = keeperNames(p); return kn.length ? 'Child. Managed by ' + listWords(kn) : 'Child'; }
  return fb ? 'Not connected' : '';
}

/* ---- Settings -> Family membership (every member sees this) ---- */
function renderMembershipPanel(){
  const fb = S.cfg.mode === 'firebase'; if(!fb) return '';
  const m = me(); const org = S.snap.org || {known: false};
  let h = '<section class="panel"><h3>Family membership</h3>';
  if(!m){
    h += '<p class="hint">This phone hasn\u2019t picked who it is yet, so there is nothing to leave.</p></section>';
    return h;
  }
  h += '<p class="hint">Two different things, on purpose. Neither one deletes your list, your wishes or anything anyone has already bought.</p>';
  h += '<div class="actions"><button class="btn" data-act="leave">Leave this family on this phone</button></div>' +
    '<p class="hint">Disconnects this phone only. If you use ' + esc(S.cfg.familyName) + ' on another phone, that one keeps working.</p>';
  h += '<div class="actions"><button class="btn danger" data-act="leave:group">Leave family group</button></div>' +

        esc(f ? f.text : 'The checks did not run. Refresh and try again.') + ' The full check is in Diagnostics below.</p>';

      '<div class="actions"><button class="btn primary" data-act="manage:open">Manage family</button></div></section>';

function openWishSheet(wish, ownerId, sharedUrl, sharedTitle, kind){
  const idea = kind === 'idea' || !!(wish && wish.kind === 'idea');
  const editing = !!wish; const owners = keptOwners();
  const w = wish || {ownerId: ownerId || S.cfg.meId, title: '', url: '', price: '', store: '', imageUrl: '', exactItem: true, note: ''};
  S.editingWish = wish || null; S.editingOwner = w.ownerId; S.editingKind = idea ? 'idea' : 'wish';
  if(idea && !ideasVisibleFor(memberById(w.ownerId))){ S.editingKind = null; toast('Gift ideas are not available for that person.', 'err'); return; }
  const ownerSel = (!idea && !editing && owners.length > 1) ? '<label class="field">For<select name="owner">' + owners.map(m =>
    '<option value="' + esc(m.id) + '"' + (m.id === w.ownerId ? ' selected' : '') + '>' + (m.id === S.cfg.meId ? 'Me (' + esc(m.name) + ')' : esc(m.name)) + '</option>').join('') + '</select></label>' : '';
  const owner = memberById(w.ownerId);
  const heading = idea ? (editing ? 'Edit gift idea' : 'Suggest a gift idea for ' + esc(owner ? owner.name : '')) :
    editing ? 'Edit wish' : (owner && owner.id !== S.cfg.meId && owners.length <= 1 ? 'Add a wish for ' + esc(owner.name) : 'Add a wish');
  openSheet('<form data-form="wish" id="wishForm" novalidate><h2>' + heading + '</h2>' + ownerSel +
    (idea ? '<p class="hint">' + esc(owner ? owner.name : 'They') + ' will never see this. Everyone else in the family can, and can reserve it.</p>' : '') +
    '<label class="field">Product link<input name="url" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://" value="' + esc(w.url) + '"></label>' +
    '<button type="button" class="btn" data-act="wish:fill">Fill in from link</button>' +
    '<p class="fill-status" id="fillStatus" role="status"></p>' +
    '<label class="field">What is it?<input name="title" maxlength="300" value="' + esc(w.title) + '"></label>' +
    '<div class="row2"><label class="field">Price<input name="price" maxlength="40" value="' + esc(w.price) + '"></label>' +
    '<label class="field">Store<input name="store" maxlength="80" value="' + esc(w.store) + '"></label></div>' +
    '<div class="preview" id="imgPreview"></div><input type="hidden" name="imageUrl" value="' + esc(w.imageUrl) + '">' +
    '<fieldset class="yn"><legend>Only this exact item?</legend>' +
    '<label><input type="radio" name="exact" value="yes"' + (w.exactItem ? ' checked' : '') + '> Yes, this exact one</label>' +
    '<label><input type="radio" name="exact" value="no"' + (!w.exactItem ? ' checked' : '') + '> No, something similar is fine</label></fieldset>' +
    '<label class="field">' + (idea ? 'Notes for other shoppers' : 'Notes for shoppers') + '<textarea name="note" maxlength="500" placeholder="Size, color, anything that helps">' + esc(w.note) + '</textarea></label>' +
    '<div class="sheet-actions"><button type="button" class="btn quiet" data-act="sheet:close">Cancel</button><button type="submit" class="btn primary">' + (idea ? 'Save idea' : 'Save wish') + '</button></div></form>');
  showPreview(w.imageUrl);
  if(sharedUrl){
    const f = $('#wishForm'); field(f, 'url').value = sharedUrl;
    if(sharedTitle && !field(f, 'title').value){ field(f, 'title').value = sharedTitle.slice(0, 300); field(f, 'title').dataset.auto = '1'; }
    doFill();
  }
}
function showPreview(url){
  const p = $('#imgPreview'); if(!p) return;
  p.innerHTML = url ? '<img class="thumb" src="' + esc(url) + '" alt="" referrerpolicy="no-referrer"><button type="button" class="btn quiet" data-act="img:clear">Remove picture</button>' : '';
}
function setFill(kind, msg){ const el = $('#fillStatus'); if(el){ el.className = 'fill-status ' + (kind || ''); el.textContent = msg; } }
async function doFill(){
  const f = $('#wishForm'); if(!f) return;
  const b = f.querySelector('[data-act="wish:fill"]');
  const url = normalizeUrl(field(f, 'url').value);
  if(!url){ setFill('err', 'Paste a full web link first, like https://www.target.com/…'); return; }
  field(f, 'url').value = url;
  if(!Platform.isNative){ setFill('warn', 'Filling from a link only works in the Android app. Type the details in below.'); return; }
  setFill('', 'Reading the page…'); if(b) b.disabled = true;

/* ---- 0.9.2: the Manage Family report ----
   0.9.1's refusal toast pointed at Settings, Diagnostics, but nothing was ever written there. Now every
   Manage Family action is recorded on this phone (never on the server) BEFORE anything is sent, then
   updated with the outcome, so the record survives the refresh that follows and even a crash mid-way.
   Sign-in ids appear only as fingerprints (fp). */
function mfTrace(action, p, count){
  return {at: Date.now(), version: APP_VERSION, action,
    target: p ? p.name : '?', targetId: p ? p.id : '?', targetStatus: p ? String(p.status) : '?',
    targetRole: p ? (p.role || 'member') : '?', targetSignIn: p && typeof p.uid === 'string' ? fp(p.uid) : 'not connected',
    byMember: S.cfg ? String(S.cfg.meId || '') : '', bySignIn: S.backend ? fp(S.backend.uid) : 'none',
    organizerCount: count === undefined ? 'not used' : count === null ? 'unreadable' : String(count),
    step: 'starting', accessTotal: null, accessFound: null, accessRecords: [], writes: [],
    outcome: 'started - no result recorded (the app stopped before the server answered)',
    code: '', server: '', verdicts: [], failedWrites: '', rulesAdmin2: ''};
}
/* Every sign-in id this phone knows about, so none leaks into a saved report in raw form. */
function scrubAllUids(t){
  t = String(t == null ? '' : t);
  const ids = new Set();
  if(S.backend && S.backend.uid) ids.add(S.backend.uid);
  ((S.snap && (S.snap.allMembers || S.snap.members)) || []).forEach(m => { if(typeof m.uid === 'string' && m.uid) ids.add(m.uid); });
  ids.forEach(u => { t = t.split(u).join(fp(u)); });
  /* Anything still shaped like a Firebase sign-in id (in a path the server quoted back). */
  return t.replace(/(access\/)([A-Za-z0-9_-]{20,40})/g, (x, a, u) => a + fp(u));
}
/* The server names each write it judged: "... for 'update' @ L318, ... for 'delete' @ L181". Firestore
   batches are all-or-nothing and it reports a verdict for every write, including writes that only failed
   because the batch did; so the verdicts are kept word for word, and each attempted write is matched to
   the verdicts for its kind of operation. */
function mfVerdicts(detail){
  const out = []; const re = /([^,]*?)\s*for '(create|update|delete|get|list)' @ L(\d+)/g; let x;
  const d = String(detail || '');
  while((x = re.exec(d))) out.push({op: x[2], line: 'L' + x[3], why: x[1].replace(/^\s+/, '').slice(0, 160)});
  return out;
}
function saveMfReport(tr){
  try {
    const t = JSON.parse(scrubAllUids(JSON.stringify(tr)));
    const hist = readJSON(K.mflast); const list = Array.isArray(hist) ? hist : [];
    const i = list.findIndex(r => r.at === t.at && r.action === t.action);
    if(i >= 0) list[i] = t; else list.unshift(t);
    writeJSON(K.mflast, list.slice(0, 5));
  } catch(e){ Diag.unexp('Could not keep the Manage Family report: ' + ((e && e.message) || e)); }
}
async function mfRun(fn, okMsg, selfCut, info){
  const tr = mfTrace(info ? info.action : 'manage family', info ? info.target : null, info ? info.count : undefined);
  saveMfReport(tr);
  try { await fn(tr); }
  catch(e){
    const err = asAppError(e);
    tr.outcome = err.code === 'PERMISSION_DENIED' ? 'refused by the server' : 'failed';
    tr.code = err.code; tr.server = String(err.detail || err.message || '').slice(0, 900);
    tr.verdicts = mfVerdicts(err.detail);
    if(tr.step === 'commit' && tr.writes.length){
      const kinds = new Set(tr.verdicts.map(v => v.op));
      tr.failedWrites = tr.verdicts.length
        ? tr.writes.filter(w => kinds.has(w.op)).map(w => '#' + w.n + ' ' + w.op + ' ' + w.path).join('; ')
        : 'the server did not name the write (whole batch refused)';
    } else tr.failedWrites = 'no write was sent: the step "' + tr.step + '" failed';
    if(err.code === 'PERMISSION_DENIED' && S.backend && S.backend.rulesProbeAdmin2){
      try { const r = await S.backend.rulesProbeAdmin2();
        tr.rulesAdmin2 = r.live === true ? '0.9.2 or later (Manage Family fix live)' : r.live === false
          ? 'older than 0.9.2 - these rules refuse Remove, Restore and Disconnect; publish firebase/firestore.rules from 0.9.2'
          : 'unknown (' + r.detail + ')'; } catch(x){ tr.rulesAdmin2 = 'unknown'; }
    }
    saveMfReport(tr);
    closeSheet();
    toast(err.code === 'PERMISSION_DENIED'
      ? 'The server refused that. Refresh and try again \u2014 the details are in Settings, Diagnostics.'
      : 'That did not work: ' + err.message, 'err');
    try { await refresh(); } catch(x){}
    return;
  }
  tr.outcome = 'done'; saveMfReport(tr);
  closeSheet();
  if(selfCut){
    Platform.removeItem(K.cfg); Platform.removeItem(K.cache);
    S.cfg = null; S.backend = null; S.snap = null; S.error = null; S.manage = false;
    S.tab = 'mine'; S.setup = 'home'; Diag.reset(); render(); toast(okMsg); return;
  }
  await refresh(); toast(okMsg);
}

      await refresh();

      if(err.code === 'PERMISSION_DENIED') throw new AppError('RULES', RULES_OLD_MSG, err.detail);
      if(err.code === 'NOT_FOUND') throw new AppError('NOT_FOUND', 'That gift changed while you were looking. The list is refreshed; try again.', err.detail);

const forms = {
  hold: async f => {
    const hours = parseInt(field(f, 'hours').value, 10);
    if(HOLD_CHOICES.indexOf(hours) < 0) throw new AppError('BAD_INPUT', 'Pick one of the listed hold times.');
    await S.backend.setHold(hours, S.cfg.meId);
    toast(hours ? 'Holds now last ' + holdLabel(hours) + ' for everyone.' : 'Holds now never run out, for everyone.'); await refresh();
  },
  join: async f => {
    const code = field(f, 'code').value; S.join = {draft: code};
    const inv = readInvite(code);
    if(!inv){ setupFail(new AppError('BAD_INVITE', 'That isn’t an Under the Tree invite code. It starts with UTT2-.')); return; }
    if(inv.old){ setupFail(new AppError('OLD_INVITE', OLD_INVITE_MSG)); return; }
    const cfg = {mode: 'firebase', projectId: BACKEND.projectId, familyId: inv.familyId, familyName: inv.familyName, meId: null};
    const be = new FirestoreBackend(cfg);
    try {
      await be.joinWithInvite(inv.code);
      const fam = await be.getFamily();
      if(!fam){ setupFail(new AppError('NO_FAMILY', 'No family matches that invite code. Ask for a fresh one.')); return; }
      cfg.familyName = fam.name || cfg.familyName;
      /* 0.9.0: a removed person is never offered to a joining phone. The server would refuse the
         claim anyway, but offering a name that cannot be picked is worse than not offering it. */
      const members = (await be.listMembers()).filter(x => !isRemoved(x));
      S.join = {cfg: cfg, be: be, members: members, draft: code}; S.joinMode = null; S.setup = 'pick'; S.setupError = ''; render();
    } catch(e){ setupFail(e); }
  },
  joinnew: async f => {
    const name = field(f, 'name').value.trim(); if(!name){ setupFail(new AppError('NO_NAME', 'Type your name first.')); return; }
    try { const m = await S.join.be.addMember(name.slice(0, 60), {claim: true}); S.join.cfg.meId = m.id; } catch(e){ setupFail(e); return; }
    await finishSetup(S.join.cfg, S.join.be);
  },
  start: async f => {
    const familyName = field(f, 'familyName').value.trim(), name = field(f, 'name').value.trim();
    if(!familyName || !name){ setupFail(new AppError('MISSING', 'Fill in the family name and your name.')); return; }
    const cfg = {mode: 'firebase', projectId: BACKEND.projectId, familyId: null, familyName: familyName.slice(0, 80), meId: null};
    const be = new FirestoreBackend(cfg);
    try { const r = await be.createFamily(cfg.familyName, name.slice(0, 60)); cfg.familyId = r.familyId; cfg.meId = r.meId; }
    catch(e){ setupFail(e); return; }
    S.tab = 'settings'; await finishSetup(cfg, be);
    if(!S.error) toast('Family created. Share the invite code below.');
  },
  demo: async f => {
    const name = field(f, 'name').value.trim(); if(!name){ setupFail(new AppError('NO_NAME', 'Type your name first.')); return; }
    const cfg = {mode: 'demo', familyId: 'demo', familyName: 'Demo family', meId: null};
    const be = new LocalBackend(cfg); const r = await be.createFamily(cfg.familyName, name.slice(0, 60)); cfg.meId = r.meId;
    await finishSetup(cfg, be);
  },
  claimnew: async f => {
    const name = field(f, 'name').value.trim(); if(!name){ toast('Type your name first.', 'err'); return; }
    const m = await S.backend.addMember(name.slice(0, 60), {claim: true});
    S.cfg.meId = m.id; saveCfg(); await refresh();
  },
  person: async f => {
    const name = field(f, 'name').value.trim(); if(!name){ toast('Type a name first.', 'err'); return; }
    dupCheck(name, async () => {
      await S.backend.addMember(name.slice(0, 60), {managed: false});
      closeSheet(); toast(name + ' added. They can join with the family invite code and pick their name.'); await refresh();
    });
  },
  child: async f => {
    const name = field(f, 'name').value.trim(); S.childDraft.name = field(f, 'name').value;
    if(!name){ toast('Type the child\u2019s name first.', 'err'); return; }
    dupCheck(name, async () => {
      const live = v010Live(); const extra = live ? S.childDraft.extra.slice() : [];
      const out = await S.backend.addMember(name.slice(0, 60), {managed: true, meId: live ? S.cfg.meId : undefined, extraManagers: extra});
      S.childDraft = null; closeSheet();
      const failed = (out.managerFailures || []);
      if(failed.length){
        const nm = failed.map(x => (memberById(x.id) || {name: x.id}).name);
        Diag.unexp(name + ' was added (managed member), but ' + listWords(nm) + ' could not be made a manager: ' + failed.map(x => x.error.code).join(', '));
        toast(name + ' was added, but ' + listWords(nm) + ' could not be made ' + (nm.length === 1 ? 'a manager' : 'managers') + '. Try again from ' + name + '\u2019s page in Family.', 'err');
      } else toast(name + ' added. Managed by you' + (extra.length ? ' and ' + listWords(extra.map(id => (memberById(id) || {name: id}).name)) : '') + '.');
      await refresh();
    });
  },
  claimcode: async f => {
    const code = normClaimCode(field(f, 'code').value);
